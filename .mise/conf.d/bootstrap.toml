[tasks."bootstrap:op"]
usage = '''
arg "<cluster>" help="The cluster to bootstrap 1Password for."
'''
run = '''
vault_name="cluster-${usage_cluster?}"
op vault get "${vault_name}" 2>&1 >/dev/null || op vault create "${vault_name}"
'''

[tasks."bootstrap:age"]
usage = '''
arg "<cluster>" help="The cluster to bootstrap Age keys for."
'''
run = '''
vault_name="cluster-${usage_cluster?}"
key_data=$(age-keygen)
pubkey=$(echo "${key_data}" | grep "public key" | awk '{print $4}')
privkey=$(echo "${key_data}" | grep "AGE-SECRET-KEY")
op item get "bs-sops" --vault "${vault_name}" 2>&1 >/dev/null || op item create --title "bs-sops" --vault "cluster-${usage_cluster?}" --category "password" "username=${pubkey}" "password=${privkey}"
echo "Created Age keypair for cluster ${usage_cluster?} and stored in 1Password vault ${vault_name}."
echo "Configuring SOPS to use the Age key for encryption."
cat <<EOF >> "{{ config_root }}/.sops.yaml"
  - path_regex: ${usage_cluster?}\/flux\/secrets\/.+\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    mac_only_encrypted: true
    age:
      - # my key
        age1jcw72528ypksvce8nc87kc00ujswpt6w4ah8sx238f0rc4cgl9lsux5s7a
      - # ${usage_cluster?} cluster key
        ${pubkey}
EOF
'''

[tasks."bootstrap:pki"]
usage = '''
arg "<cluster>" help="The cluster to bootstrap PKI CAs for."
'''
run = '''
mise run //pki:intermediate:create "${usage_cluster?}" --generation v1 --root root-v1
'''

[tasks."bootstrap:flux"]
usage = '''
arg "<cluster>" help="The cluster to bootstrap Flux for."
arg "<op-token>" help="The 1Password token to use for Flux."
'''
tools = { "aqua:chevdor/tera-cli" = "0.5.1" }
run = '''
flux_templates_dir="{{ config_root }}/.mise/conf.d/bootstrap/flux"
templates_out_dir="{{ config_root }}/kube/clusters/${usage_cluster?}/flux"
mise run //:util:render "${usage_cluster?}" "${flux_templates_dir}/apps.yaml" --output "${templates_out_dir}/apps.yaml"
mise run //:util:render "${usage_cluster?}" "${flux_templates_dir}/clusterinfo.yaml" --output "${templates_out_dir}/clusterinfo.yaml"
mise run //:util:render "${usage_cluster?}" "${flux_templates_dir}/flux-instance.yaml" --output "${templates_out_dir}/flux-instance.yaml"
mise run //:util:render "${usage_cluster?}" "${flux_templates_dir}/kustomization.yaml" --output "${templates_out_dir}/kustomization.yaml"
mise run //:util:render "${usage_cluster?}" "${flux_templates_dir}/secrets.yaml" --output "${templates_out_dir}/secrets.yaml"
mise run //:util:render "${usage_cluster?}" "${flux_templates_dir}/instance/helmrelease.yaml" --output "${templates_out_dir}/instance/helmrelease.yaml"
mise run //:util:render "${usage_cluster?}" "${flux_templates_dir}/instance/ocirepository.yaml" --output "${templates_out_dir}/instance/ocirepository.yaml"
mise run //:util:render "${usage_cluster?}" "${flux_templates_dir}/secrets/op-token.sops.yaml" --output "${templates_out_dir}/secrets/op-token.sops.yaml" --extra-vars "{\"op_token\": \"${usage_op_token?}\"}"
fnox exec -- sops -e -i "${templates_out_dir}/secrets/op-token.sops.yaml"
'''

[tasks."bootstrap:kube:ns"]
usage = '''
arg "<cluster>" help="The cluster to bootstrap Flux for."
'''
tools = { "aqua:chevdor/tera-cli" = "0.5.1" }
run = '''
core_dir="{{ config_root }}/kube/deploy/core"
namespaces=$(find "${core_dir}" -mindepth 1 -maxdepth 1 -type d)
KUBECONFIG="{{ config_root }}/kube/clusters/${usage_cluster?}/kubeconfig"

if [ ! -f "${KUBECONFIG}" ]; then
  mise run //:kubeconfig "${usage_cluster?}"
fi

for ns in ${namespaces}; do
  ns_name=$(basename "${ns}")
  if kubectl get namespace "${ns_name}" >/dev/null 2>&1; then
    echo "Namespace ${ns_name} already exists in cluster ${usage_cluster?}, skipping creation."
    continue
  fi
  echo "Creating namespace ${ns_name} in cluster ${usage_cluster?}..."
  kubectl apply -f "${ns}/namespace.yaml"
done
'''

[tasks."kubeconfig"]
usage = '''
arg "<cluster>" help="The cluster to generate a Kubeconfig for."
'''
run = '''
cd "{{ config_root }}/kube/clusters/${usage_cluster?}/talos"
topf kubeconfig --validity 3600h > "{{ config_root }}/kube/clusters/${usage_cluster?}/kubeconfig"
'''

[tasks."talosconfig"]
usage = '''
arg "<cluster>" help="The cluster to generate a Talosconfig for."
'''
run = '''
cd "{{ config_root }}/kube/clusters/${usage_cluster?}/talos"
topf talosconfig > "{{ config_root }}/kube/clusters/${usage_cluster?}/kubeconfig"
'''
