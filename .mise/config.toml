monorepo_root = true

[monorepo]
config_roots = ["pki"]

[tools]
age = "1.3.2"
aube = { version = "v2.10.0", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"] }
fnox = { version = "v1.48.0", workflow = "release.yml" }
helmfile = { version = "1.8.4", workflow = "releaser.yaml" }
hk = { version = "2.12.0", workflow = "release.yml" }
jactionlint = { version = "2.6.0", workflow = "release.yaml" }
kubectl = "1.37.2"
shellcheck = "0.11.0"
sops = "3.13.3"
terraform = "1.17.2"
usage = { version = "7.3.0", workflow = "publish-cli.yml" }
yq = "4.54.3"
uv = "0.13.8"

# kubectl plugins
cmctl = "2.6.2"
"aqua:cilium/cilium-cli" = "0.20.3"
# "aqua:kyverno/kyverno" = "1.20.0"
"github:home-operations/kopiur" = { version = "0.10.20", matching = "kubectl-kopiur_", rename_exe = "kubectl-kopiur", os = ["!windows"] }
"github:cloudnative-pg/cloudnative-pg" = { version = "1.30.1", matching = "kubectl-cnpg_", rename_exe = "kubectl-cnpg" }
"github:kguardian-dev/kguardian" = { version = "1.12.0", version_prefix = "advisor/", rename_exe = "kubectl-kguardian" }

[hooks]
postinstall = "hk install"

[secrets.fnox]
