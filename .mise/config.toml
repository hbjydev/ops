monorepo_root = true

[monorepo]
config_roots = ["pki"]

[tools]
age = "1.3.2"
aube = { version = "2.9.0", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"] }
fnox = { version = "1.47.0", workflow = "release.yml" }
helmfile = { version = "1.8.2", workflow = "releaser.yaml" }
hk = { version = "2.12.0", workflow = "release.yml" }
jactionlint = "2.5.0"
kubectl = "1.37.2"
shellcheck = "0.11.0"
sops = "3.13.3"
terraform = "1.17.1"
usage = { version = "7.2.0", workflow = "publish-cli.yml" }
yq = "4.54.1"

# kubectl plugins
cmctl = "2.6.2"
"aqua:cilium/cilium-cli" = "0.20.2"
"aqua:kyverno/kyverno" = "1.19.2"
"github:home-operations/kopiur" = { version = "0.10.18", matching = "kubectl-kopiur_", rename_exe = "kubectl-kopiur", os = ["!windows"] }
"github:cloudnative-pg/cloudnative-pg" = { version = "1.30.1", matching = "kubectl-cnpg_", rename_exe = "kubectl-cnpg" }
"github:kguardian-dev/kguardian" = { version = "1.12.0", version_prefix = "advisor/", rename_exe = "kubectl-kguardian" }
uv = "0.13.7"

[hooks]
postinstall = "hk install"

[secrets.fnox]
