---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kaniop
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../kube/components/namespace
    - ../../../../../kube/components/namespace-backups
    - ../../../../../kube/components/app-template
    - ../../../../../kube/components/grafana-folder
    - ../../../../../kube/clusters/phoebe/components/registry-credentials
    - ../../../../../kube/clusters/phoebe/components/github-status
    - ../../../../../kube/clusters/phoebe/components/sops
  interval: 1h
  path: ./kubernetes/apps/security/kaniop/app
  prune: true
  retryInterval: 5m
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  targetNamespace: security
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kaniop-instance
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: core-kopiur-config
      namespace: kopiur-system
    - name: kaniop
  interval: 1h
  path: ./kubernetes/apps/security/kaniop/instance
  prune: true
  retryInterval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  targetNamespace: security
  wait: false
