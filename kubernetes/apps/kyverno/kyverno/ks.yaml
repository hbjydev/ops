---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  labels:
    kustomization.flux.home.arpa/defaults: disabled
spec:
  suspend: true
  deletionPolicy: Orphan
  interval: 1h
  path: ./kubernetes/apps/kyverno/kyverno/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kyverno
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-config
  namespace: kyverno
  labels:
    kustomization.flux.home.arpa/defaults: disabled
spec:
  suspend: true
  deletionPolicy: Orphan
  dependsOn:
    - name: kyverno
    - name: core-trust-manager-bundle
      namespace: trust-manager
  interval: 1h
  path: ./kubernetes/apps/kyverno/kyverno/config
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
