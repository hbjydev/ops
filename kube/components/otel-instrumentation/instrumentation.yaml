---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/instrumentation_v1alpha1.json
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: ns-instrumentation
spec:
  exporter:
    endpoint: http://otel-daemonset-collector.observability.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
