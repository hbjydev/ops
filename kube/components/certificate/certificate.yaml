---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${APP}
  namespace: ${NAMESPACE}
spec:
  dnsNames:
    - "${SUBDOMAIN:-${APP}}.hayden.moe"
  duration: 160h
  issuerRef:
    name: ${TLS_ISSUER:-letsencrypt-production}
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: ${SUBDOMAIN:-${APP}}-hayden-moe-tls
  usages:
    - digital signature
