---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ${APP}-dragonfly-tunnel
spec:
  selector:
    matchLabels:
      dragonfly.home.arpa/tunnel: ${APP}
  podMetricsEndpoints:
    - port: dfguard-metrics
      path: /metrics
      interval: 30s
