---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: not-used
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              labelSelector: "dragonfly.home.arpa/no-stunnel!=true"
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ignored
              spec:
                template:
                  metadata:
                    labels:
                      dragonfly.home.arpa/tunnel: ${APP}
                      egress.netpol.home.arpa/o11y: allow
                  spec:
                    volumes:
                      - name: dragonfly-certs
                        csi:
                          driver: csi.cert-manager.io
                          readOnly: true
                          volumeAttributes:
                            csi.cert-manager.io/issuer-name: dfguard-client-ca-v2
                            csi.cert-manager.io/issuer-kind: ClusterIssuer
                            csi.cert-manager.io/key-algorithm: ECDSA
                            csi.cert-manager.io/key-size: "384"
                            csi.cert-manager.io/key-encoding: PKCS8
                            csi.cert-manager.io/key-usages: client auth
                            csi.cert-manager.io/dns-names: ${APP}
                      - name: trusted-roots
                        configMap:
                          name: trusted-roots
                          defaultMode: 0440

                    initContainers:
                      - name: dragonfly-tunnel
                        restartPolicy: Always
                        image: ghcr.io/hbjydev/dfguard:otel-test-2
                        args: ["tunnel"]
                        ports:
                          - name: dfguard-metrics
                            containerPort: 10001
                        env:
                          - name: DFGUARD_TUNNEL_CERT
                            value: /var/run/secrets/dragonfly/tls.crt
                          - name: DFGUARD_TUNNEL_KEY
                            value: /var/run/secrets/dragonfly/tls.key
                          - name: DFGUARD_TUNNEL_CA
                            value: /var/run/secrets/root-ca/ca.crt
                          - name: DFGUARD_TUNNEL_UPSTREAM
                            value: dfguard.database.svc.cluster.local.:6379
                          - name: DFGUARD_TUNNEL_TCP_NODELAY
                            value: "true"
                          - name: OTEL_EXPORTER_OTLP_ENDPOINT
                            value: https://otel-gateway-collector.observability.svc.cluster.local:4317
                          - name: OTEL_EXPORTER_OTLP_CERTIFICATE
                            value: /var/run/secrets/root-ca/ca.crt
                          - name: POD_UID
                            valueFrom:
                              fieldRef:
                                fieldPath: metadata.uid
                          - name: OTEL_RESOURCE_ATTRIBUTES
                            value: k8s.pod.uid=$(POD_UID),k8s.container.name=dragonfly-tunnel
                        volumeMounts:
                          - name: dragonfly-certs
                            mountPath: /var/run/secrets/dragonfly
                            readOnly: true
                          - name: trusted-roots
                            mountPath: /var/run/secrets/root-ca
                            readOnly: true
                        resources:
                          requests:
                            cpu: 10m
                            memory: 100Mi
                          limits:
                            memory: 512Mi
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop:
                              - ALL
                          seccompProfile:
                            type: RuntimeDefault
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              labelSelector: "m00nlit.dev/no-dragonfly-stunnel!=true"
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: ignored
              spec:
                template:
                  metadata:
                    labels:
                      dragonfly.home.arpa/tunnel: ${APP}
                      egress.netpol.home.arpa/o11y: allow
                  spec:
                    volumes:
                      - name: dragonfly-certs
                        csi:
                          driver: csi.cert-manager.io
                          readOnly: true
                          volumeAttributes:
                            csi.cert-manager.io/issuer-name: dfguard-client-ca-v2
                            csi.cert-manager.io/issuer-kind: ClusterIssuer
                            csi.cert-manager.io/key-algorithm: ECDSA
                            csi.cert-manager.io/key-size: "384"
                            csi.cert-manager.io/key-encoding: PKCS8
                            csi.cert-manager.io/key-usages: client auth
                            csi.cert-manager.io/dns-names: ${APP}
                      - name: trusted-roots
                        configMap:
                          name: trusted-roots
                          defaultMode: 0440

                    initContainers:
                      - name: dragonfly-tunnel
                        restartPolicy: Always
                        image: ghcr.io/hbjydev/dfguard:otel-test
                        args: ["tunnel"]
                        ports:
                          - name: dfguard-metrics
                            containerPort: 10001
                        env:
                          - name: DFGUARD_TUNNEL_CERT
                            value: /var/run/secrets/dragonfly/tls.crt
                          - name: DFGUARD_TUNNEL_KEY
                            value: /var/run/secrets/dragonfly/tls.key
                          - name: DFGUARD_TUNNEL_CA
                            value: /var/run/secrets/root-ca/ca.crt
                          - name: DFGUARD_TUNNEL_UPSTREAM
                            value: dfguard.database.svc.cluster.local.:6379
                          - name: DFGUARD_TUNNEL_TCP_NODELAY
                            value: "true"
                          - name: OTEL_EXPORTER_OTLP_ENDPOINT
                            value: https://otel-gateway-collector.observability.svc.cluster.local:4317
                          - name: OTEL_EXPORTER_OTLP_CERTIFICATE
                            value: /var/run/secrets/root-ca/ca.crt
                          - name: POD_UID
                            valueFrom:
                              fieldRef:
                                fieldPath: metadata.uid
                          - name: OTEL_RESOURCE_ATTRIBUTES
                            value: k8s.pod.uid=$(POD_UID),k8s.container.name=dragonfly-tunnel
                        volumeMounts:
                          - name: dragonfly-certs
                            mountPath: /var/run/secrets/dragonfly
                            readOnly: true
                          - name: trusted-roots
                            mountPath: /var/run/secrets/root-ca
                            readOnly: true
                        resources:
                          requests:
                            cpu: 10m
                            memory: 100Mi
                          limits:
                            memory: 512Mi
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop:
                              - ALL
                          seccompProfile:
                            type: RuntimeDefault
