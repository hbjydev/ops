---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kaniop
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    # The CRD apply hook inherits these labels; the operator pod is patched below.
    additionalLabels:
      egress.netpol.home.arpa/apiserver: allow
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRules:
        enabled: true
      dashboards:
        enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: kaniop
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kaniop
              spec:
                template:
                  metadata:
                    labels:
                      egress.netpol.home.arpa/apiserver: allow
                      ingress.netpol.home.arpa/host: allow
                      ingress.netpol.home.arpa/o11y: allow
                      egress.netpol.home.arpa/internet-https: allow
