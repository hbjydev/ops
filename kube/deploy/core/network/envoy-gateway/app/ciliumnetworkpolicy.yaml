---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Managed Envoy proxies connect to the controller xDS server on 18000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-x-a-envoy-gateway
  namespace: network
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-helm
      app.kubernetes.io/instance: envoy-gateway
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: '8081'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            netpol.home.arpa/o11y: 'true'
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: '19001'
              protocol: TCP
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '9443'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            app.kubernetes.io/name: envoy
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: '18000'
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# The chart's pre-install/pre-upgrade certgen pod only carries app=certgen.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-envoy-gateway-certgen
  namespace: network
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app: certgen
      io.cilium.k8s.policy.serviceaccount: envoy-gateway-gateway-helm-certgen
  egress:
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
