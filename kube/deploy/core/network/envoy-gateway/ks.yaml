---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-envoy-gateway
  namespace: network
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app envoy-gateway
  interval: 1h
  path: ./kube/deploy/core/network/envoy-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: &namespace network
  timeout: 5m
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: network
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
