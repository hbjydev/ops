---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    podLabels:
      egress.netpol.home.arpa/apiserver: allow
    agent:
      podLabels:
        egress.netpol.home.arpa/apiserver: allow
      resources:
        limits:
          memory: 192Mi
    autoTieBreaker: false
    monitoring:
      dashboards:
        enabled: true
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
