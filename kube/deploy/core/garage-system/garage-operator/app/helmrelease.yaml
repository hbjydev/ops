---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-operator
spec:
  chartRef:
    kind: OCIRepository
    name: garage-operator
  interval: 1h
  values:
    crds:
      install: true
      keep: true
    webhooks:
      enabled: true
      certManager:
        enabled: true
    serviceMonitor:
      enabled: true
    podLabels:
      egress.netpol.home.arpa/apiserver: allow
      ingress.netpol.home.arpa/host: allow
      ingress.netpol.home.arpa/o11y: allow
      ingress.netpol.home.arpa/apiserver: allow
