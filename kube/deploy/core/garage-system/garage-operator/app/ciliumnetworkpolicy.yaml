---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Reconcile Garage through its admin API, without granting S3 or inter-node RPC access.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-x-a-garage-operator
  namespace: garage-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage-operator
      app.kubernetes.io/instance: garage-operator
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: '8081'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            netpol.home.arpa/o11y: 'true'
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: '8443'
              protocol: TCP
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '9443'
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
            - key: garage.rajsingh.info/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: '3903'
              protocol: TCP
