---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Reconcile Garage through its admin API, without granting S3 or inter-node RPC access.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-garage-operator
  namespace: garage-system
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage-operator
      app.kubernetes.io/instance: garage-operator
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
            - key: garage.rajsingh.info/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: '3903'
              protocol: TCP
