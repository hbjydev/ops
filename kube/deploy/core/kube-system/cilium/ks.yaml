---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-cilium
  namespace: &ns kube-system
  labels:
    kustomization.flux.home.arpa/name: "cilium"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  path: ./kube/deploy/core/kube-system/cilium/app
  dependsOn: []
  targetNamespace: *ns
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-cilium-netpols
  namespace: kube-system
spec:
  dependsOn:
    - name: core-cilium
  path: ./kube/deploy/core/kube-system/cilium/netpols
  targetNamespace: kube-system
