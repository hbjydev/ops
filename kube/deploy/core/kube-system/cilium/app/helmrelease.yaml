---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    meta.helm.sh/release-name: cilium
    meta.helm.sh/release-namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  interval: 5m
  timeout: 1h
  chartRef:
    kind: OCIRepository
    name: cilium
  values:
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

# [pref] disable envoy
    envoy:
      enabled: false
    ingressController:
      enabled: false

# [o11y] enable hubble
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
        podLabels:
          egress.netpol.home.arpa/apiserver: allow

# [perf] scale operator to 1 replica
    operator:
      replicas: 1
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
# needed for talos
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    cgroup:
      autoMount:
        enabled: true
      hostRoot: /sys/fs/cgroup
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
