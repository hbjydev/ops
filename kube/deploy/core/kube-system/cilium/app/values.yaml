---
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

# [pref] disable envoy
envoy:
  enabled: false
ingressController:
  enabled: false

# [o11y] enable hubble
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    podLabels:
      egress.netpol.home.arpa/apiserver: allow

# [perf] scale operator to 1 replica
operator:
  replicas: 1

# needed for talos
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID,
          SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: true
  hostRoot: /sys/fs/cgroup
