---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: np-e-a-to-apiserver
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      egress.netpol.home.arpa/apiserver: allow
  egress:
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "6443"

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: np-e-a-to-cloudflare-dns
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      egress.netpol.home.arpa/cloudflare-dns: allow
  egress:
    - toCIDR:
        # Standard and Families resolvers used by cert-manager's DNS01 configuration.
        # https://developers.cloudflare.com/1.1.1.1/ip-addresses/
        - 1.1.1.1/32
        - 1.0.0.1/32
        - 1.1.1.2/32
        - 1.0.0.2/32
        - 1.1.1.3/32
        - 1.0.0.3/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

