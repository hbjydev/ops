---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-ksgate
  namespace: kube-system
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  interval: 1h
  path: ./kube/deploy/core/kube-system/ksgate/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ksgate
      namespace: kube-system
