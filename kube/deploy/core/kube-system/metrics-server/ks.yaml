---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-metrics-server
  namespace: &ns kube-system
  labels:
    kustomization.flux.home.arpa/name: "metrics-server"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  path: ./kube/deploy/core/kube-system/metrics-server/app
  targetNamespace: *ns
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
