---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-snapshot-controller
  namespace: kube-system
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  interval: 1h
  path: ./kube/deploy/core/kube-system/snapshot-controller/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: snapshot-controller
      namespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: snapshot-controller
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
