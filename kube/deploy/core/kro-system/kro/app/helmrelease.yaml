---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kro
spec:
  chartRef:
    kind: OCIRepository
    name: kro
  interval: 1h
  values:
    deployment:
      podLabels:
        egress.netpol.home.arpa/apiserver: allow
        ingress.netpol.home.arpa/host: allow
        ingress.netpol.home.arpa/o11y: allow
    config:
      featureGates:
        CELOmitFunction: true
    metrics:
      service:
        create: true
      serviceMonitor:
        enabled: true
