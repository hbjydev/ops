---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/trust.cert-manager.io/bundle_v1alpha1.json
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: trusted-roots
spec:
  sources:
    - useDefaultCAs: true
    - configMap:
        name: pki-root
        key: root.pem
  target:
    configMap:
      key: "ca.crt"
