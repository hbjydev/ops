---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-trust-manager
  namespace: &ns trust-manager
  labels:
    kustomization.flux.home.arpa/decryption: disabled
    kustomization.flux.home.arpa/name: "trust-manager"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  path: ./kube/deploy/core/trust-manager/trust-manager/app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: trust-manager
      namespace: trust-manager
  dependsOn:
    - name: core-cert-manager
      namespace: cert-manager
    - name: core-prometheus-crds
      namespace: observability
  targetNamespace: *ns
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-trust-manager-bundle
  namespace: &ns trust-manager
  labels:
    kustomization.flux.home.arpa/decryption: disabled
    kustomization.flux.home.arpa/name: "trust-manager"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  path: ./kube/deploy/core/trust-manager/trust-manager/bundle
  healthChecks:
    - apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      name: trusted-roots
  dependsOn:
    - name: core-trust-manager
    - name: core-cert-manager-ca
      namespace: cert-manager
  targetNamespace: *ns
