---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-external-secrets
  namespace: &ns external-secrets
  labels:
    kustomization.flux.home.arpa/name: "external-secrets"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: external-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
  retryInterval: 2m
  timeout: 15m
  path: ./kube/deploy/core/external-secrets/external-secrets/app
  dependsOn:
    - name: core-cert-manager
      namespace: cert-manager
  targetNamespace: *ns
