---
manager:
  collectorImage:
    repository: otel/opentelemetry-collector-contrib
  podLabels:
    egress.netpol.home.arpa/apiserver: allow
    ingress.netpol.home.arpa/apiserver: allow
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
admissionWebhooks:
  certManager:
    enabled: true
crds:
  create: true
