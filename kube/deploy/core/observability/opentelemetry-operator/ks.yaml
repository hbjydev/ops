---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-opentelemetry-operator
  namespace: observability
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app opentelemetry-operator
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: opentelemetry-operator
      namespace: observability
  interval: 1h
  path: ./kube/deploy/core/observability/opentelemetry-operator/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: &namespace observability
  timeout: 5m
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
    - name: core-cert-manager
      namespace: cert-manager
  wait: false
