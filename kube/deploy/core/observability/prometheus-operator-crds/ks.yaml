---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-prometheus-crds
  namespace: observability
  labels:
    kustomization.flux.home.arpa/defaults: disabled
spec:
  path: ./kube/deploy/core/observability/prometheus-operator-crds/app
  interval: 1h
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-operator-crds
      namespace: observability
