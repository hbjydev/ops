---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Grafana API and the dashboard download hosts configured in this repository.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-x-a-grafana-operator
  namespace: observability
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator
      app.kubernetes.io/instance: grafana-operator
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: '8081'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            netpol.home.arpa/o11y: 'true'
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app: grafana
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP
    - toFQDNs:
        - matchName: grafana.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
