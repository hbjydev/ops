---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-crossplane
  namespace: crossplane-system
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app crossplane
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: crossplane
      namespace: crossplane-system
  interval: 1h
  path: ./kube/deploy/core/crossplane-system/crossplane/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: &namespace crossplane-system
  timeout: 5m
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
  wait: false
