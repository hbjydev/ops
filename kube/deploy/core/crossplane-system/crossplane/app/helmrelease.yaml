---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
spec:
  interval: 1h
  chart:
    spec:
      chart: crossplane
      version: 2.5.0
      sourceRef:
        kind: HelmRepository
        name: crossplane
      interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    metrics:
      enabled: true
    customLabels:
      egress.netpol.home.arpa/apiserver: allow
      ingress.netpol.home.arpa/o11y: allow
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: crossplane
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: crossplane
              spec:
                template:
                  metadata:
                    labels:
                      ingress.netpol.home.arpa/apiserver: allow
                      egress.netpol.home.arpa/internet-https: allow
