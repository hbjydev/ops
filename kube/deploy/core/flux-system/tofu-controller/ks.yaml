---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-tofu-controller
  namespace: flux-system
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app tofu-controller
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tofu-controller
      namespace: flux-system
  path: ./kube/deploy/core/flux-system/tofu-controller/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: &namespace flux-system
  wait: false
  interval: 1h
  prune: true
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
