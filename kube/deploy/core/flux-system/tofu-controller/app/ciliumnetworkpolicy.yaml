---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Runner RPC and Flux artifact/event traffic have no matching shared label.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-tofu-controller
  namespace: flux-system
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tofu-controller
      app.kubernetes.io/instance: tofu-controller
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tf-runner
            app.kubernetes.io/created-by: tofu-controller
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - flux-system
                - network
      toPorts:
        - ports:
            - port: '30000'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app: source-controller
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app: notification-controller
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: np-x-a-tofu-runners
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tf-runner
      app.kubernetes.io/created-by: tofu-controller
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - flux-system
          - network
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app.kubernetes.io/name: tofu-controller
            app.kubernetes.io/instance: tofu-controller
      toPorts:
        - ports:
            - port: '30000'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app: source-controller
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-flux-from-tofu
  namespace: flux-system
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - source-controller
          - notification-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app.kubernetes.io/name: tofu-controller
            app.kubernetes.io/instance: tofu-controller
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-source-from-tofu-runners
  namespace: flux-system
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app: source-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tf-runner
            app.kubernetes.io/created-by: tofu-controller
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - flux-system
                - network
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
