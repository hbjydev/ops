---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: tofu-controller-defaults
    - kind: ConfigMap
      name: tofu-controller-values
      optional: true
