---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-flux-operator
  namespace: &ns flux-system
  labels:
    kustomization.flux.home.arpa/name: "flux-operator"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  path: ./kube/deploy/core/flux-system/flux-operator/app
  dependsOn: []
  targetNamespace: *ns
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-flux-netpols
  namespace: flux-system
spec:
  dependsOn:
    - name: core-cilium
      namespace: kube-system
  path: ./kube/deploy/core/flux-system/flux-operator/netpols
  targetNamespace: flux-system
