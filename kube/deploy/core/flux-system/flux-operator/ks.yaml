---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-flux-operator
  namespace: &ns flux-system
  labels:
    kustomization.flux.home.arpa/name: "flux-operator"
    kustomization.flux.home.arpa/defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: flux-operator
  components:
    - ../../../../apps/${CLUSTER}/flux-system/flux-operator/overrides
  ignoreMissingComponents: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: flux-operator
      namespace: *ns
  interval: 1h
  path: ./kube/deploy/core/flux-system/flux-operator/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: *ns
  targetNamespace: *ns
  timeout: 5m
