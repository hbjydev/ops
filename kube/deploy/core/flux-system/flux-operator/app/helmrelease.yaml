---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
    remediation:
      retries: -1
  rollback:
    cleanupOnFail: true
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    strategy:
      name: RemediateOnFailure
    remediation:
      # Keep a failed upgrade visible rather than rolling back automatically.
      remediateLastFailure: false
      retries: 2
  values:
    commonLabels:
      egress.netpol.home.arpa/apiserver: allow
      egress.netpol.home.arpa/internet-https: allow
    serviceMonitor:
      create: true
