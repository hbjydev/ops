---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-flux-to-notification
  namespace: flux-system
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - source-controller
          - helm-controller
          - kustomize-controller
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app: notification-controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-notification-from-flux
  namespace: flux-system
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app: notification-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
          matchExpressions:
            - key: app
              operator: In
              values:
                - source-controller
                - helm-controller
                - kustomize-controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
