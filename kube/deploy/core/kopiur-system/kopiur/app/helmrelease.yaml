---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 30m
  install:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: kopiur-defaults
    - kind: ConfigMap
      name: kopiur-values
      optional: true
