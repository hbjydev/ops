---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: 3.9.2
      sourceRef:
        kind: HelmRepository
        name: kyverno
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      migration:
        podLabels:
          egress.netpol.home.arpa/apiserver: allow
    webhooksCleanup:
      podLabels:
        egress.netpol.home.arpa/apiserver: allow
    admissionController:
      replicas: 1
      podLabels:
        ingress.netpol.home.arpa/apiserver: allow
        egress.netpol.home.arpa/apiserver: allow
      serviceMonitor:
        enabled: true
    backgroundController:
      enabled: false
      serviceMonitor:
        enabled: true
    cleanupController:
      enabled: false
      serviceMonitor:
        enabled: true
    reportsController:
      enabled: false
      serviceMonitor:
        enabled: true
    features:
      admissionReports:
        enabled: false
      backgroundScan:
        enabled: false
    config:
      excludeKyvernoNamespace: true
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - flux-system
                - cert-manager
