---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-kyverno
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  interval: 1h
  path: ./kube/deploy/core/kyverno/kyverno/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kyverno
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-kyverno-config
  namespace: kyverno
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  dependsOn:
    - name: core-kyverno
    - name: core-trust-manager-bundle
      namespace: trust-manager
  interval: 1h
  path: ./kube/deploy/core/kyverno/kyverno/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
