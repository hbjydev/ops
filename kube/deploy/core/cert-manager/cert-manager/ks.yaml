---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-cert-manager
  namespace: &ns cert-manager
  labels:
    kustomization.flux.home.arpa/name: "cert-manager"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  path: ./kube/deploy/core/cert-manager/cert-manager/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: cert-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
  retryInterval: 2m
  timeout: 5m
  targetNamespace: *ns

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-cert-manager-ca
  namespace: &ns cert-manager
  labels:
    kustomization.flux.home.arpa/name: "cert-manager"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  path: ./kube/deploy/core/cert-manager/cert-manager/ca
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: ca-${CLUSTER}-v1
      namespace: cert-manager
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: cluster-ca
  dependsOn:
    - name: core-cert-manager
    - name: core-external-secrets
      namespace: external-secrets
  targetNamespace: *ns

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-cert-manager-letsencrypt
  namespace: &ns cert-manager
  labels:
    kustomization.flux.home.arpa/name: "cert-manager"
    kustomization.flux.home.arpa/helmpatches: "false"
spec:
  path: ./kube/deploy/core/cert-manager/cert-manager/letsencrypt
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: cf-api-token
      namespace: cert-manager
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: letsencrypt-production
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: letsencrypt-staging
  dependsOn:
    - name: core-cert-manager
    - name: core-external-secrets
      namespace: external-secrets
  targetNamespace: *ns
