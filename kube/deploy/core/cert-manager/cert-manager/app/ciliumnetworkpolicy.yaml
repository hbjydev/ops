---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-cm-to-letsencrypt
  namespace: cert-manager
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  egress:
    - toFQDNs:
        - matchPattern: 'acme-v02.api.letsencrypt.org'
        - matchPattern: 'acme-staging-v02.api.letsencrypt.org'
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-cm-to-cloudflare
  namespace: cert-manager
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  egress:
    - toFQDNs:
        - matchPattern: '*.cloudflare.com'
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
