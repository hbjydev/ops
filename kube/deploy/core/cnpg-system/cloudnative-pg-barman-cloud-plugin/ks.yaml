---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-cloudnative-pg-barman-cloud-plugin
  namespace: cnpg-system
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app cloudnative-pg-barman-cloud-plugin
  dependsOn:
    - name: core-cloudnative-pg
      namespace: &namespace cnpg-system
    - name: core-cert-manager
      namespace: cert-manager
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: barman-cloud
      namespace: *namespace
  interval: 1h
  path: ./kube/deploy/core/cnpg-system/cloudnative-pg-barman-cloud-plugin/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
