---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    kustomization.flux.home.arpa/decryption: disabled
  name: core-kyverno
  namespace: kyverno
spec:
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
  interval: 1h
  path: ./kube/deploy/core/kyverno/kyverno/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kyverno
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    kustomization.flux.home.arpa/decryption: disabled
  name: core-kyverno-config
  namespace: kyverno
spec:
  dependsOn:
    - name: core-kyverno
    - name: core-trust-manager-bundle
      namespace: trust-manager
  interval: 1h
  path: ./kube/deploy/core/kyverno/kyverno/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kyverno
