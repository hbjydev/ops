---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: website
spec:
  dependsOn:
    - name: envoy-gateway-gateways
      namespace: network
  interval: 1h
  path: ./kube/deploy/apps/rhea/website/website/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: website
  timeout: 5m
  wait: true
