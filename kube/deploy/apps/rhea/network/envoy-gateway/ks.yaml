---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    kustomization.flux.home.arpa/decryption: disabled
  name: core-envoy-gateway
  namespace: network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: envoy-gateway
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: network
  interval: 1h
  path: ./kube/deploy/core/network/envoy-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  timeout: 5m
  wait: false

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    kustomization.flux.home.arpa/decryption: disabled
  name: envoy-gateway-gateways
  namespace: network
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: envoy-gateway
  dependsOn:
    - name: core-envoy-gateway
    - name: core-cert-manager-letsencrypt
      namespace: cert-manager
  components:
    - ../../../../../../components/certificate
  postBuild:
    substitute:
      APP: envoy-gateways
      NAMESPACE: network
      SUBDOMAIN: rhea
  interval: 1h
  path: ./kube/deploy/apps/rhea/network/envoy-gateway/gateways
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  timeout: 5m
  wait: false
