---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cloudflare-dns
  - ./envoy-gateway/ks.yaml
  - ./iroh-relay/ks.yaml
  - ./towonel-hub/ks.yaml
namespace: network
components:
  - ../../../../components/namespace
  - ../../../../components/namespace-backups
  - ../../../../components/app-template
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          pod-security.kubernetes.io/enforce: privileged
