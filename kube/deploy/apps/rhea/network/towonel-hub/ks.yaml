---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: towonel-hub
  namespace: network
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: towonel-hub
  dependsOn:
    - name: iroh-relay
      namespace: network
    - name: miroir-config
      namespace: miroir-system
    - name: core-external-secrets-1password
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: towonel-hub
      namespace: network
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: towonel-hub
      namespace: network
  interval: 1h
  path: ./kube/deploy/apps/base/network/towonel-hub/app
  postBuild:
    substitute:
      DOMAIN: thighhighs.moe
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  timeout: 10m
  patches:
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: towonel-hub
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: towonel-hub
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              remediateLastFailure: false
              retries: 2
          values:
            edge:
              httpsPort: 4443
              httpPort: 8081
            defaultPodOptions:
              nodeSelector:
                kubernetes.io/hostname: rhea-controlplane-01
            controllers:
              main:
                containers:
                  main:
                    env:
                      TOWONEL_HUB_RELAY_URL: https://relay.towonel.thighhighs.moe:8443
                      TOWONEL_HUB_TRUSTED_PROXIES: ${CLUSTER_POD_CIDR}
                      TOWONEL_EDGE_RELAY_URL: https://relay.towonel.thighhighs.moe:8443
                      TOWONEL_EDGE_HUB_LINK_ADDR: 127.0.0.1:51444
                      TOWONEL_EDGE_PROXY_PROTOCOL_TRUSTED: ${CLUSTER_POD_CIDR}
            service:
              main:
                forceRename: towonel-hub
              claimed:
                controller: main
                type: NodePort
                externalTrafficPolicy: Local
                ports:
                  tcp-5349:
                    port: 5349
                    targetPort: 5349
                    nodePort: 5349
                    protocol: TCP
                  tcp-6969:
                    port: 6969
                    targetPort: 6969
                    nodePort: 6969
                    protocol: TCP
                  tcp-25565:
                    port: 25565
                    targetPort: 25565
                    nodePort: 25565
                    protocol: TCP
                  tcp-2468:
                    port: 2468
                    targetPort: 2468
                    nodePort: 2468
                    protocol: TCP
                  udp-3478:
                    port: 3478
                    targetPort: 3478
                    nodePort: 3478
                    protocol: UDP
                  udp-25565:
                    port: 25565
                    targetPort: 25565
                    nodePort: 25565
                    protocol: UDP
              iroh:
                controller: main
                type: NodePort
                externalTrafficPolicy: Local
                ports:
                  iroh:
                    port: 51820
                    targetPort: 51820
                    nodePort: 51820
                    protocol: UDP
            persistence:
              data:
                storageClass: miroir-local
          postRenderers:
            - kustomize:
                patches:
                  - target:
                      kind: DaemonSet
                      name: towonel-hub
                    patch: |-
                      apiVersion: apps/v1
                      kind: DaemonSet
                      metadata:
                        name: towonel-hub
                      spec:
                        template:
                          spec:
                            hostNetwork: false
                            dnsPolicy: ClusterFirst
                            containers:
                              - name: main
                                securityContext:
                                  allowPrivilegeEscalation: false

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: towonel-hub-routes
  namespace: network
spec:
  dependsOn:
    - name: towonel-hub
    - name: envoy-gateway-gateways
  interval: 1h
  path: ./kube/deploy/apps/rhea/network/towonel-hub/routes
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
