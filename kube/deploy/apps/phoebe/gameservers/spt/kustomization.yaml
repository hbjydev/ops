---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gameservers
resources:
  - ../../../base/gameservers/spt/ks.yaml
  - ./dnsendpoint.yaml
configMapGenerator:
  - name: spt-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: &app spt
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: &app spt
      spec:
        postBuild:
          substitute:
            KOPIUR_CAPACITY: 5Gi
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_STORAGECLASS: miroir-local
            KOPIUR_SNAPSHOTCLASS: miroir-snap
