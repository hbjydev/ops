---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ../../../base/observability/kube-prometheus-stack/ks.yaml
  - ./grafanadashboard.yaml
  - ./scrapeconfig.yaml
configMapGenerator:
  - name: kube-prometheus-stack-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: kube-prometheus-stack
    patch: "apiVersion: kustomize.toolkit.fluxcd.io/v1\nkind: Kustomization\nmetadata:\n  name: kube-prometheus-stack\nspec:\n  dependsOn:\n    - name: core-prometheus-crds\n      namespace: observability\n    - name: miroir-config\n      namespace: miroir-system\n"
