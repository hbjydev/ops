---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    kustomization.flux.home.arpa/defaults: disabled
    kustomization.flux.home.arpa/helm-defaults: disabled
  name: kube-prometheus-stack
  namespace: observability
spec:
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/observability/kube-prometheus-stack/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
  patches:
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: kube-prometheus-stack
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kube-prometheus-stack
        spec:
          values:
            grafana:
              operator:
                dashboardsConfigMapRefEnabled: true
                folder: observability
                matchLabels:
                  grafana.internal/instance: grafana
            kubeEtcd:
              service:
                selector:
                  component: kube-apiserver # etcd runs on control plane nodes
