---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ../../../base/observability/gatus/ks.yaml
configMapGenerator:
  - name: gatus-configmap
    files:
      - config.yaml=./resources/config.yaml
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
      labels:
        app.kubernetes.io/name: &app gatus
  - name: gatus-values
    files:
      - values.yaml=values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Kustomization
      name: &app gatus
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: &app gatus
      spec:
        dependsOn:
          - name: core-kyverno-config
            namespace: kyverno
          - name: core-kopiur-config
            namespace: kopiur-system
          - name: miroir-config
            namespace: miroir-system
        postBuild:
          substitute:
            GATUS_SUBDOMAIN: status
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_SNAPSHOTCLASS: miroir-snap
