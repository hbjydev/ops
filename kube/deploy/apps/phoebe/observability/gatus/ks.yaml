---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gatus
  namespace: observability
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: gatus
  dependsOn:
    - name: core-kyverno-config
      namespace: kyverno
    - name: core-kopiur-config
      namespace: kopiur-system
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/observability/gatus/app
  postBuild:
    substitute:
      APP: gatus
      GATUS_SUBDOMAIN: status
      KOPIUR_REPOSITORY: hetzner
      KOPIUR_SNAPSHOTCLASS: miroir-snap
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 5m
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              # Never auto-rollback a failed upgrade. A Helm rollback
              # restores the previous chart *and* its values, so for
              # rook-ceph-cluster it silently downgraded Ceph and left
              # the mon crashlooping against a newer on-disk layout.
              # A failed upgrade should stay failed and visible.
              #
              # This must be set explicitly: Flux defaults it to true
              # whenever retries > 0, so removing the line would not
              # change the behaviour.
              remediateLastFailure: false
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: gatus
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: gatus
        spec:
          values:
            route:
              app:
                annotations:
                  gatus.home-operations.com/enabled: "false"
                hostnames:
                  - "{{ .Release.Name }}.hayden.moe"
                  - status.hayden.moe
                parentRefs:
                  - name: external
                    namespace: network
                    sectionName: https
            controllers:
              gatus:
                statefulset:
                  volumeClaimTemplates:
                    - name: config
                      storageClass: miroir-local
                      accessMode: ReadWriteOnce
                      size: 5Gi
