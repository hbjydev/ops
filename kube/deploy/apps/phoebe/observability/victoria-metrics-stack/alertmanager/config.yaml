---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vmalertmanagerconfig_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: alertmanager
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: &app victoria-metrics-alertmanager
spec:
  route:
    receiver: blackhole
    repeat_interval: 12h
    routes:
      - receiver: blackhole
        matchers:
          - alertname=InfoInhibitor
    group_by:
      - alertname
      - cluster
      - job
    group_interval: 5m
    group_wait: 1m

  receivers:
    - name: blackhole
