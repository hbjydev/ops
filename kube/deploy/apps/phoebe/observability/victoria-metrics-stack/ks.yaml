      kind: VMAlertmanager
      name: alertmanager
      namespace: observability
  interval: 1h
  path: ./kube/deploy/apps/base/observability/victoria-metrics-stack/alertmanager
  postBuild:
    substitute:
      ALERTMANAGER_REPLICAS: '2'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  timeout: 5m
