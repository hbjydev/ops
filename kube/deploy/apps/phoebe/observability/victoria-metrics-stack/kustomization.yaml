---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ../../../base/observability/victoria-metrics-stack/ks.yaml
  - ../../../../core/observability/victoria-metrics-operator/ks.yaml
  - ./operator/grafanadashboard.yaml
  - ./metrics/tsproxy.yaml
  - ./metrics/grafanadatasource.yaml
  - ./logs/tsproxy.yaml
  - ./logs/grafanadatasource.yaml
  - ./traces/tsproxy.yaml
  - ./traces/grafanadatasource.yaml
  - ./alertmanager/grafanadatasource.yaml
  - ./alertmanager/config.yaml
patches:
  - target:
      kind: Kustomization
      name: victoria-metrics
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: &app victoria-metrics
      spec:
        dependsOn:
          - name: core-kopiur-config
            namespace: kopiur-system
          - name: victoria-metrics-operator
        postBuild:
          substitute:
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_SNAPSHOTCLASS: miroir-snap
            STORAGE_CLASS: miroir-local
            STORAGE_CAPACITY: 50Gi
            RETENTION_PERIOD: '"12"'
  - target:
      kind: Kustomization
      name: victoria-logs
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: &app victoria-logs
      spec:
        dependsOn:
          - name: core-kopiur-config
            namespace: kopiur-system
          - name: victoria-metrics-operator
        postBuild:
          substitute:
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_SNAPSHOTCLASS: miroir-snap
            STORAGE_CLASS: miroir-local
            STORAGE_CAPACITY: 50Gi
            RETENTION_PERIOD: '"12"'
  - target:
      kind: Kustomization
      name: victoria-traces
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: &app victoria-traces
      spec:
        dependsOn:
          - name: core-kopiur-config
            namespace: kopiur-system
          - name: victoria-metrics-operator
        postBuild:
          substitute:
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_SNAPSHOTCLASS: miroir-snap
            STORAGE_CLASS: miroir-local
            STORAGE_CAPACITY: 50Gi
            RETENTION_PERIOD: '"12"'
  - target:
      kind: Kustomization
      name: victoria-metrics-alertmanager
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: &app victoria-metrics-alertmanager
      spec:
        postBuild:
          substitute:
            ALERTMANAGER_REPLICAS: '2'
