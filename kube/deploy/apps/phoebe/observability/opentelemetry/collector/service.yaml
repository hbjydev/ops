---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: otel-syslog-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: observability.otel-gateway
  ports:
    - name: syslog
      port: 514
      targetPort: 514
      protocol: TCP
    - name: syslog-unifi
      port: 515
      targetPort: 515
      protocol: TCP
