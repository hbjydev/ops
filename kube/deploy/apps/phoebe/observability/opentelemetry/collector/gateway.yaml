---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  labels:
    netpol.home.arpa/o11y: "true"
    # The operator propagates these labels to the collector and target allocator.
    egress.netpol.home.arpa/apiserver: allow
    ingress.netpol.home.arpa/host: allow
    ingress.netpol.home.arpa/o11y: allow
    ingress.netpol.home.arpa/internal: allow
spec:
  mode: statefulset
  replicas: 1
  serviceAccount: otel-gateway
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.165.0

  targetAllocator:
    enabled: true
    serviceAccount: otel-collector-ta
    allocationStrategy: consistent-hashing
    mtls:
      enabled: true
      useCertManager: true
    prometheusCR:
      enabled: true
      serviceMonitorSelector: {}
      podMonitorSelector: {}
      secretNamespaces: [observability, default, ai]

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  env:
    - name: GOMEMLIMIT
      value: 640MiB

  ports:
    - name: syslog
      port: 514
      protocol: TCP
    - name: syslog-unifi
      port: 515
      protocol: TCP

  volumes:
    - name: otlp-tls
      csi:
        driver: csi.cert-manager.io
        readOnly: true
        volumeAttributes:
          csi.cert-manager.io/issuer-name: cluster-ca
          csi.cert-manager.io/issuer-kind: ClusterIssuer
          csi.cert-manager.io/key-algorithm: ECDSA
          csi.cert-manager.io/key-size: "384"
          csi.cert-manager.io/key-encoding: PKCS8
          csi.cert-manager.io/key-usages: digital signature,server auth
          csi.cert-manager.io/dns-names: otel-gateway-collector.observability.svc.cluster.local,otel-gateway-collector.observability.svc
          csi.cert-manager.io/fs-group: "10001"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

  volumeMounts:
    - name: otlp-tls
      mountPath: /var/run/otlp-tls
      readOnly: true

  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [observability]
                  selectors:
                    - role: pod
                      label: app.kubernetes.io/component=opentelemetry-collector
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: keep
                  regex: Running
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod

            - job_name: kubelet-cadvisor
              kubernetes_sd_configs:
                - role: node
              metrics_path: /metrics/cadvisor
              scheme: https
              scrape_interval: 30s
              scrape_timeout: 10s
              body_size_limit: 32MiB
              tls_config:
                insecure_skip_verify: true
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - source_labels: [__metrics_path__]
                  target_label: metrics_path
                - target_label: job
                  replacement: kubelet
              metric_relabel_configs:
                # Retain id to distinguish cgroups without pod or container labels.
                - action: labeldrop
                  regex: "^(uid|name)$"

            - job_name: kubelet-metrics
              kubernetes_sd_configs:
                - role: node
              metrics_path: /metrics
              scheme: https
              scrape_interval: 30s
              scrape_timeout: 10s
              tls_config:
                insecure_skip_verify: true
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - source_labels: [__metrics_path__]
                  target_label: metrics_path
                - target_label: job
                  replacement: kubelet

      syslog/new:
        tcp:
          listen_address: "[::]:514"
        protocol: rfc5424

      syslog/unifi:
        tcp:
          listen_address: "[::]:515"
        protocol: rfc3164

      tcp_log:
        listen_address: "[::]:5140"

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /var/run/otlp-tls/tls.crt
              key_file: /var/run/otlp-tls/tls.key
              reload_interval: 1m
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /var/run/otlp-tls/tls.crt
              key_file: /var/run/otlp-tls/tls.key
              reload_interval: 1m

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 15

      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.node.name
            - k8s.container.name
            - container.id
            - container.image.name
            - container.image.tags
          labels:
            - tag_name: app.label.component
              key: app.kubernetes.io/component
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          # Use the original pod identity when telemetry arrives through an agent.
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name

      transform/cluster:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["cluster"], "${CLUSTER}") where attributes["cluster"] == nil

      transform/scrape_labels:
        metric_statements:
          - context: resource
            statements:
              - delete_key(attributes, "container.id")
              - delete_key(attributes, "container.image.tags")
              - delete_key(attributes, "k8s.pod.uid")
              - delete_key(attributes, "k8s.pod.start_time")
              - delete_key(attributes, "cluster.name")
              - delete_key(attributes, "k8s.cluster.name")
          # Preserve target labels as fallbacks, but prefer each metric's own labels.
          - context: datapoint
            statements:
              # The Prometheus receiver moves job and instance into resource attributes.
              - set(attributes["job"], Concat([resource.attributes["service.namespace"], resource.attributes["service.name"]], "/")) where attributes["job"] == nil and resource.attributes["service.name"] != nil and resource.attributes["service.namespace"] != nil and resource.attributes["service.namespace"] != ""
              - set(attributes["job"], resource.attributes["service.name"]) where attributes["job"] == nil and resource.attributes["service.name"] != nil
              - set(attributes["instance"], resource.attributes["service.instance.id"]) where attributes["instance"] == nil and resource.attributes["service.instance.id"] != nil
              - merge_maps(cache, resource.attributes, "upsert")
              - keep_keys(cache, ["namespace", "pod", "container", "endpoint", "service"])
              - merge_maps(attributes, cache, "insert")
          # Clear shared resource labels only after every datapoint has its fallback.
          - context: resource
            statements:
              - delete_key(attributes, "namespace")
              - delete_key(attributes, "pod")
              - delete_key(attributes, "container")
              - delete_key(attributes, "endpoint")
              - delete_key(attributes, "service")

      transform/talos:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - IsString(log.body) and IsMatch(log.body, "^\\{")
            statements:
              - merge_maps(log.cache, ParseJSON(log.body), "upsert")
              - set(resource.attributes["service.name"], log.cache["talos-service"])
              - set(resource.attributes["host.name"], log.cache["hostname"])
              - set(log.attributes["level"], log.cache["talos-level"])
              - set(log.body, log.cache["msg"])
              - set(log.time_unix_nano, UnixNano(Time(log.cache["talos-time"], "%Y-%m-%dT%H:%M:%S.%fZ")))

      transform/syslog:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["host.name"], attributes["hostname"])
              - set(resource.attributes["service.name"], attributes["appname"])
              - delete_key(attributes, "hostname")
              - delete_key(attributes, "appname")
              - set(log.body, attributes["message"])

      resource:
        attributes:
          - key: cluster.name
            value: ${CLUSTER}
            action: upsert
          - key: k8s.cluster.name
            value: ${CLUSTER}
            action: upsert

      batch:
        send_batch_size: 1024
        timeout: 5s

    exporters:
      otlp_http/vtraces:
        traces_endpoint: http://vtsingle-victoria-traces.observability.svc.cluster.local:10428/insert/opentelemetry/v1/traces
        compression: gzip
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      otlp_http/vmetrics:
        metrics_endpoint: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428/opentelemetry/v1/metrics
        compression: gzip
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      otlp_http/vlogs:
        logs_endpoint: http://vlsingle-victoria-logs.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs
        compression: gzip
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

    service:
      telemetry:
        metrics:
          # Collector >=0.123 removed `metrics.address`; use the readers form.
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource, batch]
          exporters: [otlp_http/vtraces]

        metrics/otel:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource, transform/cluster, batch]
          exporters: [otlp_http/vmetrics]

        metrics/ta:
          receivers: [prometheus]
          processors: [memory_limiter, k8s_attributes, transform/cluster, transform/scrape_labels, batch]
          exporters: [otlp_http/vmetrics]

        logs/otel:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource, batch]
          exporters: [otlp_http/vlogs]

        logs/talos_machine:
          receivers: [tcp_log]
          processors: [memory_limiter, transform/talos, batch]
          exporters: [otlp_http/vlogs]

        logs/syslog_new:
          receivers: [syslog/new]
          processors: [memory_limiter, transform/syslog, batch]
          exporters: [otlp_http/vlogs]

        logs/syslog_unifi:
          receivers: [syslog/unifi]
          processors: [memory_limiter, transform/syslog, batch]
          exporters: [otlp_http/vlogs]
