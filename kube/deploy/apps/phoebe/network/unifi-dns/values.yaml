---
provider:
  webhook:
    env:
      - name: UNIFI_HOST
        value: https://192.168.4.1
      - name: UNIFI_API_KEY
        valueFrom:
          secretKeyRef:
            name: &secret unifi-dns-secret
            key: UNIFI_API_KEY
extraArgs:
  - --gateway-name=internal
txtOwnerId: main
txtPrefix: k8s.phoebe.
domainFilters: ["hayden.moe"]
