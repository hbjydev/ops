      namespace: network
  interval: 1h
  path: ./kube/deploy/apps/phoebe/network/tailscale/connectors
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
