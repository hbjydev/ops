---
agent:
  services:
    - hostname: '*.hayden.moe'
      origin: external.network.svc.cluster.local:443
    - hostname: '*.s3.hayden.moe'
      origin: external.network.svc.cluster.local:443
  tcpServices:
    - name: forgejo-ssh
      origin: forgejo-ssh.dev.svc.cluster.local:22
      listen_port: 2468
    - name: stunner-turns-tls
      origin: stunner.network.svc.cluster.local:5349
      listen_port: 5349
    - name: spt
      origin: spt.gameservers.svc.cluster.local:6969
      listen_port: 6969
  udpServices:
    - name: stunner-turn-udp
      origin: stunner.network.svc.cluster.local:3478
      listen_port: 3478
    - name: spt-hayden-server
      origin: 192.168.4.97:25565
      listen_port: 25565
monitoring:
  dashboards:
    grafanaOperator:
      enabled: true
      allowCrossNamespaceImport: true
      matchLabels:
        grafana.internal/instance: grafana
