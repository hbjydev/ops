---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: towonel-agent
  namespace: network
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: towonel-agent
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: towonel-agent
      namespace: network
  interval: 1h
  path: ./kube/deploy/apps/base/network/towonel-agent/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  timeout: 5m
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              # Never auto-rollback a failed upgrade. A Helm rollback
              # restores the previous chart *and* its values, so for
              # rook-ceph-cluster it silently downgraded Ceph and left
              # the mon crashlooping against a newer on-disk layout.
              # A failed upgrade should stay failed and visible.
              #
              # This must be set explicitly: Flux defaults it to true
              # whenever retries > 0, so removing the line would not
              # change the behaviour.
              remediateLastFailure: false
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: towonel-agent
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: towonel-agent
        spec:
          values:
            agent:
              services:
                - hostname: '*.hayden.moe'
                  origin: external.network.svc.cluster.local:443
                - hostname: '*.s3.hayden.moe'
                  origin: external.network.svc.cluster.local:443
              tcpServices:
                - name: forgejo-ssh
                  origin: forgejo-ssh.dev.svc.cluster.local:22
                  listen_port: 2468
                - name: stunner-turns-tls
                  origin: stunner.network.svc.cluster.local:5349
                  listen_port: 5349
                - name: spt
                  origin: spt.gameservers.svc.cluster.local:6969
                  listen_port: 6969
              udpServices:
                - name: stunner-turn-udp
                  origin: stunner.network.svc.cluster.local:3478
                  listen_port: 3478
                - name: spt-hayden-server
                  origin: 192.168.4.97:25565
                  listen_port: 25565
            monitoring:
              dashboards:
                grafanaOperator:
                  enabled: true
                  allowCrossNamespaceImport: true
                  matchLabels:
                    grafana.internal/instance: grafana
