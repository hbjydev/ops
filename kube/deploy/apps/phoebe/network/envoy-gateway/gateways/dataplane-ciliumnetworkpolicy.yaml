---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-x-a-envoy-external
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: external
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: towonel-agent
            app.kubernetes.io/instance: towonel-agent
      toPorts:
        - ports:
            - port: '10443'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: '10080'
              protocol: TCP
            - port: '10443'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            tailscale.com/parent-resource: ts-srv-phoebe
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            app.kubernetes.io/instance: continuwuity
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            app.kubernetes.io/instance: livekit
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            app.kubernetes.io/instance: livekit-jwt-service
      toPorts:
        - ports:
            - port: '10443'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
            app.kubernetes.io/managed-by: litellm-operator
            app.kubernetes.io/name: mcp-hass
      toPorts:
        - ports:
            - port: '10443'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: '18000'
              protocol: TCP
            - port: '18001'
              protocol: TCP
            - port: '18002'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            ingress.netpol.home.arpa/external: allow
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kopiur-system
            app.kubernetes.io/component: ui
            app.kubernetes.io/instance: kopiur
            app.kubernetes.io/name: kopiur
      toPorts:
        - ports:
            - port: '8090'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security
            app.kubernetes.io/instance: kanidm
            app.kubernetes.io/managed-by: kaniop-kanidm
            app.kubernetes.io/name: kanidm
            kanidm.kaniop.rs/cluster: kanidm
      toPorts:
        - ports:
            - port: '8443'
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
