            control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: '18000'
              protocol: TCP
            - port: '18001'
              protocol: TCP
            - port: '18002'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            ingress.netpol.home.arpa/internal: allow
