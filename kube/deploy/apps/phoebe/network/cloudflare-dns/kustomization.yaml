---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
resources:
  - ../../../base/network/cloudflare-dns/ks.yaml
  - ./externalsecret.yaml
configMapGenerator:
  - name: cloudflare-dns-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
