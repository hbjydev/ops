---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Kaniop 0.22.1 hard-codes generated pod labels; Kanidm has no supported pod-label override.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-kanidm
  namespace: security
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kanidm
      app.kubernetes.io/instance: kanidm
      app.kubernetes.io/managed-by: kaniop-kanidm
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: '8443'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            app.kubernetes.io/managed-by: envoy-gateway
            gateway.networking.k8s.io/gateway-name: external
      toPorts:
        - ports:
            - port: '8443'
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kaniop
            app.kubernetes.io/instance: kaniop
            app.kubernetes.io/component: operator
      toPorts:
        - ports:
            - port: '8443'
              protocol: TCP
