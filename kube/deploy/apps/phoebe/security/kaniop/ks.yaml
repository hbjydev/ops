---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kaniop-instance
  namespace: security
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kaniop-instance
  dependsOn:
    - name: core-kopiur-config
      namespace: kopiur-system
    - name: kaniop
  interval: 1h
  path: ./kube/deploy/apps/phoebe/security/kaniop/instance
  prune: true
  retryInterval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
  timeout: 5m
  wait: false
