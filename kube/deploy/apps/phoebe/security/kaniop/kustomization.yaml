---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  - ../../../../core/security/kaniop/ks.yaml
  - ./ks.yaml
patches:
  - target:
      kind: Kustomization
      name: kaniop
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: kaniop
      spec:
        path: ./kube/deploy/apps/phoebe/security/kaniop/app
        components:
          - ../../../../../../components/namespace
          - ../../../../../../components/namespace-backups
          - ../../../../../../components/app-template
          - ../../../../../../components/infra-folder
          - ../../../../../../clusters/phoebe/components/registry-credentials
          - ../../../../../../clusters/phoebe/components/github-status
          - ../../../../../../clusters/phoebe/components/sops
        dependsOn:
          - name: miroir-config
            namespace: miroir-system
