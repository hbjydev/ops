---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hayden-moe
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: external
      namespace: network
  hostnames:
    - hayden.moe
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix/
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: matrix.hayden.moe
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: matrix

    - matches:
        - path:
            type: Exact
            value: /.well-known/webfinger
        - path:
            type: PathPrefix
            value: /.well-known/host-meta
        - path:
            type: PathPrefix
            value: /.well-known/nodeinfo
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: gts.hayden.moe
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: gts

    - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: hayden.moe.s3-website.uk.io.cloud.ovh.net
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: s3-website

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-hayden-moe
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: erwanleboucher
    - name: envoy-external-na
      namespace: network
      sectionName: erwanleboucher
  hostnames:
    - www.hayden.moe
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: hayden.moe
            statusCode: 301
