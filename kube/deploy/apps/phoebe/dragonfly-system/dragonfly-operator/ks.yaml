---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly-operator-config
  namespace: dragonfly-system
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  path: ./kube/deploy/apps/phoebe/dragonfly-system/dragonfly-operator/config
  targetNamespace: dragonfly-system
  dependsOn:
    - name: core-dragonfly-operator
      namespace: dragonfly-system
  prune: true
  wait: false
