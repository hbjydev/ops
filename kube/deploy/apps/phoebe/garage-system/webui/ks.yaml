---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage-webui
  namespace: garage-system
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: webui
  dependsOn:
    - name: garage
      namespace: garage-system
  interval: 1h
  path: ./kube/deploy/apps/base/garage-system/webui/app
  postBuild:
    substitute:
      APP: webui
      APP_NAMESPACE: garage-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: garage-system
  timeout: 5m
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            crds: CreateReplace
          rollback:
            cleanupOnFail: true
            recreate: true
          timeout: 15m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              remediateLastFailure: true
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: garage-webui
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: garage-webui
        spec:
          values:
            route:
              app:
                hostnames:
                  - "garage.hayden.moe"
                parentRefs:
                  - name: internal
                    namespace: network
            controllers:
              garage-webui:
                containers:
                  app:
                    env:
                      API_BASE_URL: http://garage.garage-system.svc.cluster.local:3903
                      S3_ENDPOINT_URL: http://garage.garage-system.svc.cluster.local:3900
                      API_ADMIN_KEY:
                        valueFrom:
                          secretKeyRef:
                            name: garage-operator-secret
                            key: admin-token
