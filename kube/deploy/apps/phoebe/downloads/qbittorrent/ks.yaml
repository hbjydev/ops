---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbittorrent
  namespace: downloads
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: qbittorrent
  components:
    - ../../../../../../components/kopiur
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/downloads/qbittorrent/app
  postBuild:
    substitute:
      APP: qbittorrent
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_REPOSITORY: hetzner
      KOPIUR_SNAPSHOTCLASS: miroir-snap
      KOPIUR_STORAGECLASS: miroir-local
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
  timeout: 5m
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              # Never auto-rollback a failed upgrade. A Helm rollback
              # restores the previous chart *and* its values, so for
              # rook-ceph-cluster it silently downgraded Ceph and left
              # the mon crashlooping against a newer on-disk layout.
              # A failed upgrade should stay failed and visible.
              #
              # This must be set explicitly: Flux defaults it to true
              # whenever retries > 0, so removing the line would not
              # change the behaviour.
              remediateLastFailure: false
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: qbittorrent
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: qbittorrent
        spec:
          values:
            route:
              app:
                hostnames: ["{{ .Release.Name }}.hayden.moe"]
                parentRefs:
                  - name: internal
                    namespace: network
                    sectionName: https
                rules:
                  - backendRefs:
                      - identifier: app
                        port: &port 80
            persistence:
              media:
                type: nfs
                server: ds.hayden.moe
                path: /volume1/media
                globalMounts:
                  - path: /media/downloads/qbittorrent
                    subPath: downloads/qbittorrent
            defaultPodOptions:
              annotations:
                k8s.v1.cni.cncf.io/networks: |-
                  [{
                    "name": "vpn",
                    "namespace": "kube-system",
                    "ips": ["10.90.0.10/24"],
                    "mac": "d6:67:45:f6:29:e6"
                  }]
