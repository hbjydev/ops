---
route:
  app:
    hostnames: ["{{ .Release.Name }}.hayden.moe"]
    parentRefs:
      - name: internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: &port 80
persistence:
  media:
    type: nfs
    server: ds.hayden.moe
    path: /volume1/media
    globalMounts:
      - path: /media/downloads/qbittorrent
        subPath: downloads/qbittorrent
defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["10.90.0.10/24"],
        "mac": "d6:67:45:f6:29:e6"
      }]
