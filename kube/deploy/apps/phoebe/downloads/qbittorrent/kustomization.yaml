---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - ../../../base/downloads/qbittorrent/ks.yaml
configMapGenerator:
  - name: qbittorrent-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: &app qbittorrent
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: &app qbittorrent
      spec:
        postBuild:
          substitute:
            KOPIUR_CAPACITY: 2Gi
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_STORAGECLASS: miroir-local
            KOPIUR_SNAPSHOTCLASS: miroir-snap
        dependsOn:
          - name: miroir-config
            namespace: miroir-system
