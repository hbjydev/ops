---
route:
  app:
    hostnames: ["{{ .Release.Name }}.hayden.moe"]
    parentRefs:
      - name: internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: &port 80
persistence:
  media:
    type: nfs
    server: ds.hayden.moe
    path: /volume1/media
    globalMounts:
      - path: /media
controllers:
  radarr:
    containers:
      app:
        env:
          RADARR__POSTGRES__MAINDBCONNECTIONSTRING: >-
            Host=pooler-rw.database.svc;
            Database=radarr;
            Username=radarr;
            SSL Mode=VerifyFull;
            SSL Certificate=/var/run/secrets/postgresql/tls.crt;
            SSL Key=/var/run/secrets/postgresql/tls.key;
