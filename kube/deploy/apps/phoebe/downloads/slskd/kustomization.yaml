---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
resources:
  - ../../../base/downloads/slskd/ks.yaml
  - ./externalsecret.yaml
configMapGenerator:
  - name: slskd-values
    files:
      - values.yaml=values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Kustomization
      name: slskd
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: slskd
      spec:
        dependsOn:
          - name: core-kyverno-config
            namespace: kyverno
          - name: core-kopiur-config
            namespace: kopiur-system
          - name: multus-networks
            namespace: kube-system
          - name: miroir-config
            namespace: miroir-system
        postBuild:
          substitute:
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_SNAPSHOTCLASS: miroir-snap
