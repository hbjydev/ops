---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slskd
  namespace: downloads
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  dependsOn:
    - name: core-kyverno-config
      namespace: kyverno
    - name: core-kopiur-config
      namespace: kopiur-system
    - name: multus-networks
      namespace: kube-system
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/downloads/slskd/app
  postBuild:
    substitute:
      APP: slskd
      CONTROLLER: StatefulSet
      KOPIUR_REPOSITORY: hetzner
      KOPIUR_SNAPSHOTCLASS: miroir-snap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              # Never auto-rollback a failed upgrade. A Helm rollback
              # restores the previous chart *and* its values, so for
              # rook-ceph-cluster it silently downgraded Ceph and left
              # the mon crashlooping against a newer on-disk layout.
              # A failed upgrade should stay failed and visible.
              #
              # This must be set explicitly: Flux defaults it to true
              # whenever retries > 0, so removing the line would not
              # change the behaviour.
              remediateLastFailure: false
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: slskd
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: slskd
        spec:
          values:
            route:
              app:
                hostnames:
                  - "{{ .Release.Name }}.hayden.moe"
                parentRefs:
                  - name: internal
                    namespace: network
                rules:
                  - backendRefs:
                      - identifier: app
                        port: &port 80
            defaultPodOptions:
              annotations:
                k8s.v1.cni.cncf.io/networks: |-
                  [{
                    "name": "vpn",
                    "namespace": "kube-system",
                    "ips": ["10.90.0.12/24"],
                    "mac": "d6:67:45:f6:29:e7"
                  }]
            controllers:
              slskd:
                statefulset:
                  volumeClaimTemplates:
                    - name: config
                      storageClass: miroir-local
                      accessMode: ReadWriteOnce
                      size: 5Gi
            persistence:
              media:
                type: nfs
                server: ds.hayden.moe
                path: /volume1/media
                globalMounts:
                  - path: /media/downloads/soulseek
                    subPath: downloads/soulseek
