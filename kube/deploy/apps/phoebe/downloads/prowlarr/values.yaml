---
route:
  app:
    hostnames: ["{{ .Release.Name }}.hayden.moe"]
    parentRefs:
      - name: internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: &port 80
controllers:
  prowlarr:
    containers:
      app:
        env:
          PROWLARR__POSTGRES__MAINDBCONNECTIONSTRING: >-
            Host=pooler-rw.database.svc;
            Database=prowlarr;
            Username=prowlarr;
            SSL Mode=VerifyFull;
            SSL Certificate=/var/run/secrets/postgresql/tls.crt;
            SSL Key=/var/run/secrets/postgresql/tls.key;
