---
route:
  app:
    hostnames:
      - "{{ .Release.Name }}.hayden.moe"
      - sab.hayden.moe
    parentRefs:
      - name: internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: &port 80
persistence:
  media:
    type: nfs
    server: ds.hayden.moe
    path: /volume1/media
    globalMounts:
      - path: /media/downloads/sabnzbd
        subPath: downloads/sabnzbd
defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "vpn",
        "namespace": "kube-system",
        "ips": ["10.90.0.11/24"],
        "mac": "d6:67:45:f6:29:e5"
      }]
controllers:
  sabnzbd:
    containers:
      app:
        env:
          SABNZBD__HOST_WHITELIST_ENTRIES: >-
            sabnzbd,
            sabnzbd.downloads,
            sabnzbd.downloads.svc,
            sabnzbd.downloads.svc.cluster,
            sabnzbd.downloads.svc.cluster.local,
            sab.hayden.moe,
            sabnzbd.hayden.moe
