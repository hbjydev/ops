---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../../kubernetes/components/common
resources:
  - ../../../core/kopiur-system/kopiur/ks.yaml
namespace: kopiur-system
patches:
  - target:
      kind: Kustomization
      name: core-kopiur
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: core-kopiur
      spec:
        path: ./kube/deploy/apps/phoebe/kopiur-system/app
        dependsOn:
          - name: core-snapshot-controller
            namespace: kube-system
          - name: core-prometheus-crds
            namespace: observability
  - target:
      kind: Kustomization
      name: core-kopiur-config
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: core-kopiur-config
      spec:
        path: ./kube/deploy/apps/phoebe/kopiur-system/config
        postBuild:
          substitute:
            APP: &app kopiur
            NAMESPACE: &namespace kopiur-system

            OIDC_DISPLAY_NAME: Kopiur
            OIDC_ORIGIN: https://kopiur.hayden.moe/
            OIDC_REDIRECT_URLS: '["https://kopiur.hayden.moe/oauth2/callback"]'
            OIDC_SECRET_KEY_ALIASES: '{clientId: [client-id], clientSecret: [client-secret]}'
            OIDC_GROUP_PREFIX: kopiur
            OIDC_USERS_GROUP_MEMBERS: '[hayden]'
            OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
        healthChecks:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            name: kopia-hetzner
            namespace: kopiur-system
          - apiVersion: kopiur.home-operations.com/v1alpha1
            kind: ClusterRepository
            name: hetzner
configMapGenerator:
  - name: kopiur-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
