---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: home-assistant
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  jobLabel: hass
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /api/prometheus
      interval: 60s
      honorLabels: true
      authorization:
        credentials:
          key: token
          name: hass-scrape
