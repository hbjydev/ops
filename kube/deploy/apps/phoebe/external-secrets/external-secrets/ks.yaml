---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    kustomization.flux.home.arpa/helmpatches: 'false'
    kustomization.flux.home.arpa/name: external-secrets
  name: core-external-secrets
  namespace: external-secrets
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: external-secrets
  dependsOn:
    - name: core-prometheus-crds
      namespace: observability
    - name: core-cert-manager
      namespace: cert-manager
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
  path: ./kube/deploy/apps/phoebe/external-secrets/external-secrets/app
  retryInterval: 2m
  targetNamespace: external-secrets
  timeout: 15m

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-external-secrets-config
  namespace: external-secrets
spec:
  dependsOn:
    - name: core-external-secrets
      namespace: external-secrets
  path: ./kube/deploy/core/external-secrets/external-secrets/config
  targetNamespace: external-secrets
