---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets
resources:
  - ../../../../core/external-secrets/external-secrets/ks.yaml
configMapGenerator:
  - name: external-secrets-values
    files:
      - values.yaml=app/values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
# Retain Phoebe's integration and health checks while using the shared Flux owner.
patches:
  - target:
      kind: Kustomization
      name: core-external-secrets
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: core-external-secrets
      spec:
        suspend: false
        path: ./kube/deploy/apps/phoebe/external-secrets/external-secrets/app
        dependsOn: []
        commonMetadata:
          labels:
            app.kubernetes.io/name: external-secrets
        healthChecks:
          - apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            name: external-secrets
            namespace: external-secrets
        retryInterval: 2m
        timeout: 15m
