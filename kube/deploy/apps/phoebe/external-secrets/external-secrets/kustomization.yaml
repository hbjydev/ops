---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets
resources:
  - ../../../../core/external-secrets/external-secrets/ks.yaml
configMapGenerator:
  - name: external-secrets-values
    files:
      - values.yaml=app/values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: core-external-secrets
    patch: |-
      - op: replace
        path: /spec/path
        value: ./kube/deploy/apps/phoebe/external-secrets/external-secrets/app
