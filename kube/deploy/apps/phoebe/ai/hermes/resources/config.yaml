---
model:
  default: opus-5.5
  provider: claude-subscription-directsdk-experimental

terminal:
  backend: local
  cwd: /data/workspace
  timeout: 900
  lifetime_seconds: 1800
  persistent_shell: true

timeouts:
  tools:
    concurrent_batch: 900

compression:
  enabled: true
  protect_last_n: 20
  threshold: 0.5

streaming:
  enabled: false

approvals:
  mode: smart
  timeout: 60
  cron_mode: deny

security:
  redact_secrets: true
  webiste_blocklist:
    enabled: true
    domains:
      - "169.254.169.254"
      - "metadata.google.internal"

privacy:
  redact_pii: true

agent:
  max_turns: 150
  gateway_timeout: 1800
  gateway_timeout_warning: 900
  restart_drain_timeout: 60
  api_max_retries: 3
  reasoning_effort: medium

gateway:
  multiplex_profiles: true
  profile_routes:
    - # Home Server -> Holly
      name: home-server
      platform: discord
      guild_id: "1394013827573743727"
      profile: default

delegation:
  model: sonnet-5.5
  max_concurrent_children: 6
  max_spawn_depth: 2

web:
  search_backend: searxng

discord:
  require_mention: true
  auto_thread: true
  reactions: true
  allowed_channels: "*"
