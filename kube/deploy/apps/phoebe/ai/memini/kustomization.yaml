---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ../../../base/ai/memini/ks.yaml
  - ./externalsecret.yaml
configMapGenerator:
  - name: memini-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: memini
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: memini
      spec:
        postBuild:
          substitute:
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_STORAGECLASS: miroir-local
            KOPIUR_SNAPSHOTCLASS: miroir-snap
            KOPIUR_CAPACITY: 5Gi
        dependsOn:
          - name: core-kyverno-config
            namespace: kyverno
