---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llmkube
  namespace: ai
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: llmkube
      namespace: ai
  interval: 1h
  path: ./kube/deploy/apps/base/ai/llmkube/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              # Never auto-rollback a failed upgrade. A Helm rollback
              # restores the previous chart *and* its values, so for
              # rook-ceph-cluster it silently downgraded Ceph and left
              # the mon crashlooping against a newer on-disk layout.
              # A failed upgrade should stay failed and visible.
              #
              # This must be set explicitly: Flux defaults it to true
              # whenever retries > 0, so removing the line would not
              # change the behaviour.
              remediateLastFailure: false
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: llmkube
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: llmkube
        spec:
          values:
            modelCache:
              enabled: true
              mode: shared
              # Keep the existing PVC size; Kubernetes cannot shrink an expanded claim.
              size: 100Gi
              storageClass: miroir-local
