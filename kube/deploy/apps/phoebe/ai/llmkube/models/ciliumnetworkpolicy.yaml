---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-qwen-inference
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchExpressions:
      - key: inference.llmkube.dev/service
        operator: In
        values:
          - qwen3-embedding-0.6b
          - qwen3-reranker-0.6b
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
        - matchLabels:
            app.kubernetes.io/name: memini
        - matchLabels:
            app.kubernetes.io/name: llmkube
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-llmkube-inference
  namespace: ai
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: llmkube
      control-plane: controller-manager
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: inference.llmkube.dev/service
              operator: In
              values:
                - qwen3-embedding-0.6b
                - qwen3-reranker-0.6b
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
