---
route:
  app:
    annotations:
      gatus.home-operations.com/endpoint: |-
        conditions: ["[STATUS] == 401"]
    hostnames:
      - mcp.hayden.moe
    parentRefs:
      - name: external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: &port 8080

controllers:
  app:
    containers:
      app:
        args:
          - http://litellm.ai.svc.cluster.local:4000
        env:
          EXTERNAL_URL: https://mcp.hayden.moe
          OIDC_CONFIGURATION_URL: https://sso.hayden.moe/oauth2/openid/mcp-auth-proxy/.well-known/openid-configuration
          OIDC_ALLOWED_ATTRIBUTES: /groups=mcp_auth_proxy_users@sso.hayden.moe
persistence:
  data:
    size: 1Gi
    storageClass: miroir-local
