---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-auth-proxy
  namespace: ai
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: mcp-auth-proxy
  components:
    - ../../../../../../components/kanidm/private
  dependsOn:
    - name: core-kyverno-config
      namespace: kyverno
    - name: core-kopiur-config
      namespace: kopiur-system
    - name: litellm
      namespace: ai
  interval: 1h
  path: ./kube/deploy/apps/base/ai/mcp-auth-proxy/app
  postBuild:
    substitute:
      APP: mcp-auth-proxy
      KOPIUR_REPOSITORY: hetzner
      KOPIUR_SNAPSHOTCLASS: miroir-snap
      NAMESPACE: ai
      OIDC_ADMIN_GROUP_MEMBERS: '[]'
      OIDC_ALLOW_INSECURE_CLIENT_DISABLE_PKCE: 'true'
      OIDC_DISPLAY_NAME: ChatGPT MCP gateway
      OIDC_GROUP_PREFIX: mcp_auth_proxy
      OIDC_IMAGE_URL: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/openai.svg
      OIDC_ORIGIN: https://mcp.hayden.moe
      OIDC_REDIRECT_URLS: '["https://mcp.hayden.moe/.auth/oidc/callback"]'
      OIDC_SECRET_ROTATION_ENABLED: 'false'
      OIDC_USERS_GROUP_MEMBERS: '[hayden]'
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              # Never auto-rollback a failed upgrade. A Helm rollback
              # restores the previous chart *and* its values, so for
              # rook-ceph-cluster it silently downgraded Ceph and left
              # the mon crashlooping against a newer on-disk layout.
              # A failed upgrade should stay failed and visible.
              #
              # This must be set explicitly: Flux defaults it to true
              # whenever retries > 0, so removing the line would not
              # change the behaviour.
              remediateLastFailure: false
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: mcp-auth-proxy
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: mcp-auth-proxy
        spec:
          values:
            route:
              app:
                annotations:
                  gatus.home-operations.com/endpoint: |-
                    conditions: ["[STATUS] == 401"]
                hostnames:
                  - mcp.hayden.moe
                parentRefs:
                  - name: external
                    namespace: network
                    sectionName: https
                rules:
                  - backendRefs:
                      - identifier: app
                        port: &port 8080

            controllers:
              app:
                containers:
                  app:
                    args:
                      - http://litellm.ai.svc.cluster.local:4000
                    env:
                      EXTERNAL_URL: https://mcp.hayden.moe
                      OIDC_CONFIGURATION_URL: https://sso.hayden.moe/oauth2/openid/mcp-auth-proxy/.well-known/openid-configuration
                      OIDC_ALLOWED_ATTRIBUTES: /groups=mcp_auth_proxy_users@sso.hayden.moe
            persistence:
              data:
                size: 1Gi
                storageClass: miroir-local
