---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr
  namespace: media
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: seerr
  components:
    - ../../../../../../components/kopiur
  dependsOn:
    - name: core-kyverno-config
      namespace: kyverno
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/media/seerr/app
  postBuild:
    substitute:
      APP: seerr
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_REPOSITORY: hetzner
      KOPIUR_SNAPSHOTCLASS: miroir-snap
      KOPIUR_STORAGECLASS: miroir-local
      SEERR_CACHE_CAPACITY: 10Gi
      SEERR_CACHE_STORAGE_CLASS: miroir-local
  prune: false
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  timeout: 5m
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            crds: CreateReplace
          rollback:
            cleanupOnFail: true
            recreate: true
          timeout: 15m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              remediateLastFailure: true
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: seerr
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: seerr
        spec:
          values:
            route:
              app:
                annotations:
                  gatus.home-operations.com/endpoint: |
                    url: https://request.hayden.moe/api/v1/status
                    conditions: ["[STATUS] == 200"]
                hostnames:
                  - "{{ .Release.Name }}.hayden.moe"
                  - jellyseerr.hayden.moe
                  - request.hayden.moe
                parentRefs:
                  - name: external
                    namespace: network
                    sectionName: https
                rules:
                  - backendRefs:
                      - identifier: app
                        port: &port 80
