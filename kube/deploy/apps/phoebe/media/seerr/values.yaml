---
route:
  app:
    annotations:
      gatus.home-operations.com/endpoint: |
        url: https://request.hayden.moe/api/v1/status
        conditions: ["[STATUS] == 200"]
    hostnames:
      - "{{ .Release.Name }}.hayden.moe"
      - jellyseerr.hayden.moe
      - request.hayden.moe
    parentRefs:
      - name: external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: &port 80
