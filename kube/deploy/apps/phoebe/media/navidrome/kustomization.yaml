---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ../../../base/media/navidrome/ks.yaml
  - ./externalsecret.yaml
configMapGenerator:
  - name: navidrome-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: navidrome
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: navidrome
      spec:
        postBuild:
          substitute:
            KOPIUR_CAPACITY: 32Gi
            KOPIUR_UID: "0"
            KOPIUR_GID: "0"
            KOPIUR_PRIVILEGED_MODE: "true"
            KOPIUR_RUN_AS_NON_ROOT: "false"
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_STORAGECLASS: miroir-local
            KOPIUR_SNAPSHOTCLASS: miroir-snap
        dependsOn:
          - name: core-kyverno-config
            namespace: kyverno
          - name: miroir-config
            namespace: miroir-system
