---
route:
  app:
    hostnames:
      - navidrome.hayden.moe
    parentRefs:
      - name: external
        namespace: network

persistence:
  media:
    type: nfs
    server: ds.hayden.moe
    path: /volume1/media
    globalMounts:
      - path: /media/music
        subPath: music
  plugins:
    type: nfs
    globalMounts:
      - path: /config/plugins
    server: ds.hayden.moe
    path: /volume1/media/apps/navidrome/plugins
controllers:
  navidrome:
    containers:
      app:
        env:
          ND_REVERSEPROXYWHITELIST: 172.18.0.0/16,10.80.0.0/24
          ND_BASEURL: https://navidrome.hayden.moe
