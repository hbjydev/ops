---
route:
  app:
    annotations:
      gatus.home-operations.com/endpoint: |-
        conditions: ["[STATUS] == 401"]
    hostnames:
      - "{{ .Release.Name }}.hayden.moe"
    parentRefs:
      - name: external
        namespace: network
    rules:
            # Ref: https://forums.plex.tv/t/external-srt-subtitles-are-not-working-w-reverse-proxy/886540
      - backendRefs:
          - identifier: app
            port: &port 32400
        filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              remove:
                - Range
        matches:
          - path:
              type: PathPrefix
              value: /library/streams
      - backendRefs:
          - identifier: app
            port: *port
persistence:
  media:
    type: nfs
    server: ds.hayden.moe
    path: /volume1/media
    globalMounts:
      - path: /media
  dev-dri:
    type: hostPath
    hostPath: /dev/dri
  dev-kfd:
    type: hostPath
    hostPath: /dev/kfd
defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "iot",
        "namespace": "kube-system",
        "ips": ["192.168.20.22/24"],
        "mac": "c6:07:27:af:fb:55"
      }]

controllers:
  plex:
    containers:
      app:
        env:
          PLEX_ADVERTISE_URL: https://plex.hayden.moe:443,http://192.168.20.22:32400
