---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ../../../base/media/silo/ks.yaml
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: silo-values
    files:
      - values.yaml=values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Kustomization
      name: &app silo
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: &app silo
      spec:
        dependsOn:
          - name: miroir-config
            namespace: miroir-system
        postBuild:
          substitute:
            KOPIUR_CAPACITY: 10Gi
            KOPIUR_UID: "0"
            KOPIUR_GID: "0"
            KOPIUR_PRIVILEGED_MODE: "true"
            KOPIUR_RUN_AS_NON_ROOT: "false"
            OIDC_DISPLAY_NAME: Silo
            OIDC_ORIGIN: https://silo.hayden.moe/
            OIDC_REDIRECT_URLS: '["https://silo.hayden.moe/api/v2/auth/oauth/5/callback"]'
            OIDC_GROUP_PREFIX: silo
            OIDC_SELFHST_ICON_NAME: silo-media-server
            OIDC_USERS_GROUP_MEMBERS: '[hayden, invisible]'
            OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
            OIDC_PREFER_SHORT_USERNAME: 'true'
            KOPIUR_REPOSITORY: hetzner
            KOPIUR_STORAGECLASS: miroir-local
            KOPIUR_SNAPSHOTCLASS: miroir-snap
            CACHE_STORAGE_CLASS: miroir-local
            CACHE_CAPACITY: 30Gi
