---
route:
  app:
    annotations:
      gatus.home-operations.com/endpoint: |-
        conditions: ["[STATUS] == 401"]
    hostnames:
      - "{{ .Release.Name }}.hayden.moe"
    parentRefs:
      - name: external
        namespace: network
    rules:
      - backendRefs:
          - identifier: main
            port: &port 8080

  jellyfin:
    annotations:
      gatus.home-operations.com/endpoint: |-
        conditions: ["[STATUS] == 401"]
    hostnames:
      - "jellyfin.hayden.moe"
    parentRefs:
      - name: external
        namespace: network
    rules:
      - backendRefs:
          - identifier: main
            port: &jfPort 8096

defaultPodOptions:
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [{
        "name": "iot",
        "namespace": "kube-system",
        "ips": ["192.168.20.24/24"],
        "mac": "c6:07:27:af:fb:25"
      }]
persistence:
  media:
    type: nfs
    server: ds.hayden.moe
    path: /volume1/media
    globalMounts:
      - path: /mnt/media

  dev-dri:
    type: hostPath
    hostPath: /dev/dri

  dev-kfd:
    type: hostPath
    hostPath: /dev/kfd
