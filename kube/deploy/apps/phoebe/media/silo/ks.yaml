---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silo
  namespace: media
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: silo
  components:
    - ../../../../../../components/kopiur
    - ../../../../../../components/kanidm/private
    - ../../../../../../components/postgres/cert
    - ../../../../../../components/dragonfly
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/media/silo/app
  postBuild:
    substitute:
      APP: silo
      CACHE_CAPACITY: 30Gi
      CACHE_STORAGE_CLASS: miroir-local
      DATABASE_EXTENSIONS: '[{ name: vector }]'
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_GID: '0'
      KOPIUR_PRIVILEGED_MODE: 'true'
      KOPIUR_REPOSITORY: hetzner
      KOPIUR_RUN_AS_NON_ROOT: 'false'
      KOPIUR_SNAPSHOTCLASS: miroir-snap
      KOPIUR_STORAGECLASS: miroir-local
      KOPIUR_UID: '0'
      NAMESPACE: media
      OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
      OIDC_DISPLAY_NAME: Silo
      OIDC_GROUP_PREFIX: silo
      OIDC_ORIGIN: https://silo.hayden.moe/
      OIDC_PREFER_SHORT_USERNAME: 'true'
      OIDC_REDIRECT_URLS: '["https://silo.hayden.moe/api/v2/auth/oauth/5/callback"]'
      OIDC_SELFHST_ICON_NAME: silo-media-server
      OIDC_USERS_GROUP_MEMBERS: '[hayden, invisible]'
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            crds: CreateReplace
          rollback:
            cleanupOnFail: true
            recreate: true
          timeout: 15m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              remediateLastFailure: true
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: silo
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: silo
        spec:
          values:
            route:
              app:
                annotations:
                  gatus.home-operations.com/endpoint: |-
                    conditions: ["[STATUS] == 401"]
                hostnames:
                  - "{{ .Release.Name }}.hayden.moe"
                parentRefs:
                  - name: external
                    namespace: network
                rules:
                  - backendRefs:
                      - identifier: main
                        port: &port 8080

              jellyfin:
                annotations:
                  gatus.home-operations.com/endpoint: |-
                    conditions: ["[STATUS] == 401"]
                hostnames:
                  - "jellyfin.hayden.moe"
                parentRefs:
                  - name: external
                    namespace: network
                rules:
                  - backendRefs:
                      - identifier: main
                        port: &jfPort 8096

            defaultPodOptions:
              annotations:
                k8s.v1.cni.cncf.io/networks: |-
                  [{
                    "name": "iot",
                    "namespace": "kube-system",
                    "ips": ["192.168.20.24/24"],
                    "mac": "c6:07:27:af:fb:25"
                  }]
            persistence:
              media:
                type: nfs
                server: ds.hayden.moe
                path: /volume1/media
                globalMounts:
                  - path: /mnt/media

              dev-dri:
                type: hostPath
                hostPath: /dev/dri

              dev-kfd:
                type: hostPath
                hostPath: /dev/kfd
