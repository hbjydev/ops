---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-config
  namespace: cnpg-system
  labels:
    kustomization.flux.home.arpa/decryption: disabled
spec:
  path: ./kube/deploy/apps/phoebe/cnpg-system/cloudnative-pg/config
  targetNamespace: cnpg-system
  dependsOn:
    - name: core-cloudnative-pg
      namespace: cnpg-system
  prune: true
  wait: false
  commonMetadata:
    labels:
      app.kubernetes.io/name: cloudnative-pg
