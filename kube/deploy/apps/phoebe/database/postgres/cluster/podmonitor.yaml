---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  jobLabel: postgres
  podMetricsEndpoints:
    - port: metrics
      honorLabels: true
