---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - ../../../../core/kube-system/cilium/ks.yaml
configMapGenerator:
  - name: cilium-values
    files:
      - values.yaml=app/values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
# Stage the new owner before the legacy Cilium ownership handover.
patches:
  - target:
      kind: Kustomization
      name: core-cilium
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
