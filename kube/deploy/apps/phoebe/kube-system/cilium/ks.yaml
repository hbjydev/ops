---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-config
  namespace: &namespace kube-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: cilium
      app.kubernetes.io/component: config
  interval: 1h
  path: ./kube/deploy/apps/phoebe/kube-system/cilium/config
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: phoebe-cilium-netpols
  namespace: kube-system
spec:
  dependsOn:
    - name: core-cilium-netpols
      namespace: kube-system
    - name: cilium-config
      namespace: kube-system
  path: ./kube/deploy/apps/phoebe/kube-system/cilium/netpols
  targetNamespace: kube-system
  prune: true
  wait: false
