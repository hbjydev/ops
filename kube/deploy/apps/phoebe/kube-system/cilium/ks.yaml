---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: phoebe-cilium-netpols
  namespace: kube-system
spec:
  dependsOn:
    - name: core-cilium-netpols
      namespace: kube-system
