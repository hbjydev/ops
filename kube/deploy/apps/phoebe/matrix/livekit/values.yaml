---
route:
  app:
    annotations:
      gatus.home-operations.com/enabled: "false"
    hostnames:
      - livekit.hayden.moe
    parentRefs:
      - name: internal
        namespace: network
      - name: external
        namespace: network
    rules:
      - matches:
          - path:
              value: /sfu/get
          - path:
              value: /healthz
          - path:
              value: /get_token
        backendRefs:
          - name: livekit-jwt-service
            port: 8081
      - matches:
          - path:
              value: /
        backendRefs:
          - name: livekit
            port: 7880
