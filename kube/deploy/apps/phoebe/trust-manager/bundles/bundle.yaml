---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/trust.cert-manager.io/bundle_v1alpha1.json
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: postgres-client-ca
spec:
  sources:
    - secret:
        name: postgres-client-ca
        key: tls.crt
    - secret:
        name: postgres-client-ca-v2
        key: tls.crt
    - configMap:
        name: pki-root
        key: root.pem
  target:
    secret:
      key: ca.crt
      metadata:
        labels:
          cnpg.io/reload: ''
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: database
