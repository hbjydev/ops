---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trust-manager
resources:
  - ../../../core/trust-manager
  - ./bundles.yaml
configMapGenerator:
  - name: trust-manager-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
# Removed after the old release is fully uninstalled.
patches:
  - target:
      kind: Kustomization
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
