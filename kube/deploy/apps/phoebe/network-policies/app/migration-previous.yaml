# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-seerr
  namespace: media
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: sonarr
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [default, downloads]
      toPorts: &http [{ports: [{port: "80", protocol: TCP}]}]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: radarr
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [default, downloads]
      toPorts: *http

    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: plex
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [media]
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.netpol.home.arpa/seerr: allow
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: '80'
              protocol: TCP

