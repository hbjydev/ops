---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-honcho
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: honcho
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: text-embeddings-inference
      toPorts:
        - ports:
            - port: "8080"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: llama-cpp-reranker
      toPorts:
        - ports:
            - port: "8080"
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.netpol.home.arpa/honcho: allow
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: '8000'
              protocol: TCP

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: np-apps-to-honcho
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      egress.netpol.home.arpa/honcho: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: honcho
            io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: '8000'
              protocol: TCP
