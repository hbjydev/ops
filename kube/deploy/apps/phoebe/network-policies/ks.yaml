---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: phoebe-network-policies
  namespace: flux-system
  labels:
    kustomization.flux.home.arpa/defaults: disabled
spec:
  suspend: true
  deletionPolicy: Orphan
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: core-cilium-netpols
      namespace: kube-system
    - name: cilium-config
      namespace: kube-system
  path: ./kube/deploy/apps/phoebe/network-policies/app
  prune: false
  wait: false
