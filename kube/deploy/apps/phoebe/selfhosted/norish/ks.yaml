---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: norish
  namespace: selfhosted
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: norish
  components:
    - ../../../../../../components/dragonfly
    - ../../../../../../components/kopiur
    - ../../../../../../components/postgres/cert
    - ../../../../../../components/kanidm/private
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/selfhosted/norish/app
  postBuild:
    substitute:
      APP: norish
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_REPOSITORY: hetzner
      KOPIUR_SNAPSHOTCLASS: miroir-snap
      KOPIUR_STORAGECLASS: miroir-local
      NAMESPACE: selfhosted
      OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
      OIDC_DISPLAY_NAME: Norish
      OIDC_GROUP_PREFIX: norish
      OIDC_IMAGE_URL: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/norish.svg
      OIDC_ORIGIN: https://norish.hayden.moe/
      OIDC_REDIRECT_URLS: '["https://norish.hayden.moe/api/auth/callback/oidc"]'
      OIDC_USERS_GROUP_MEMBERS: '[hayden, invisible]'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            crds: CreateReplace
          rollback:
            cleanupOnFail: true
            recreate: true
          timeout: 15m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              remediateLastFailure: true
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: norish
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: norish
        spec:
          values:
            route:
              app:
                hostnames:
                  - "{{ .Release.Name }}.hayden.moe"
                parentRefs:
                  - name: external
                    namespace: network
                    sectionName: https
                rules:
                  - backendRefs:
                      - identifier: app
                        port: &port 8080
            controllers:
              main:
                containers:
                  app:
                    env:
                      TRUSTED_ORIGINS: https://norish.hayden.moe
                      AUTH_URL: https://norish.hayden.moe
                      OIDC_NAME: 'Hayden.moe SSO'
                      OIDC_ISSUER: https://sso.hayden.moe/oauth2/openid/norish
                      OIDC_WELLKNOWN: https://sso.hayden.moe/oauth2/openid/norish/.well-known/openid-configuration
                      OIDC_ADMIN_GROUP: norish_admin@sso.hayden.moe
