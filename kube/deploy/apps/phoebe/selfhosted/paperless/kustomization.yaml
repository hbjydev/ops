---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - ../../../base/selfhosted/paperless/ks.yaml
  - ./externalsecret.yaml
configMapGenerator:
  - name: paperless-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: paperless
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: paperless
      spec:
        postBuild:
          substitute:
            OIDC_DISPLAY_NAME: Paperless
            OIDC_IMAGE_URL: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/paperless-ngx.svg
            OIDC_ORIGIN: https://paperless.hayden.moe/
            OIDC_REDIRECT_URLS: '["https://paperless.hayden.moe/accounts/oidc/kanidm/login/callback/"]'
            OIDC_GROUP_PREFIX: paperless
            OIDC_USERS_GROUP_MEMBERS: '[hayden, invisible]'
            OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
        dependsOn:
          - name: miroir-config
            namespace: miroir-system
