---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
  namespace: selfhosted
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: paperless
  components:
    - ../../../../../../components/dragonfly
    - ../../../../../../components/kanidm/private
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/selfhosted/paperless/app
  postBuild:
    substitute:
      APP: paperless
      NAMESPACE: selfhosted
      OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
      OIDC_DISPLAY_NAME: Paperless
      OIDC_GROUP_PREFIX: paperless
      OIDC_IMAGE_URL: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/paperless-ngx.svg
      OIDC_ORIGIN: https://paperless.hayden.moe/
      OIDC_REDIRECT_URLS: '["https://paperless.hayden.moe/accounts/oidc/kanidm/login/callback/"]'
      OIDC_USERS_GROUP_MEMBERS: '[hayden, invisible]'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            crds: CreateReplace
          rollback:
            cleanupOnFail: true
            recreate: true
          timeout: 15m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              remediateLastFailure: true
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: paperless
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: paperless
        spec:
          values:
            route:
              app:
                hostnames:
                  - "{{ .Release.Name }}.hayden.moe"
                parentRefs:
                  - name: external
                    namespace: network
                    sectionName: https
                rules:
                  - backendRefs:
                      - identifier: app
                        port: &port 8000
            controllers:
              paperless:
                containers:
                  app:
                    env:
                      PAPERLESS_URL: https://paperless.hayden.moe
                      PAPERLESS_SOCIALACCOUNT_PROVIDERS:
                        dependsOn:
                          - OIDC_CLIENT_ID
                          - OIDC_CLIENT_SECRET
                        value: |-
                          {
                            "openid_connect": {
                              "APPS": [
                                {
                                  "provider_id": "kanidm",
                                  "name": "Hayden's SSO (kanidm)",
                                  "client_id": "$(OIDC_CLIENT_ID)",
                                  "secret": "$(OIDC_CLIENT_SECRET)",
                                  "settings": {
                                    "server_url": "https://sso.hayden.moe/oauth2/openid/$(OIDC_CLIENT_ID)/.well-known/openid-configuration",
                                    "oauth_pkce_enabled": true
                                  }
                                }
                              ]
                            }
                          }
                      PAPERLESS_EMAIL_HOST: smtp-relay
                      PAPERLESS_EMAIL_FROM: docs@hayden.moe
            persistence:
              mnt:
                type: nfs
                server: ds.hayden.moe
                path: /volume1/media
