---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - ../../../base/selfhosted/tranquil/ks.yaml
  - ./externalsecret.yaml
  - ./serviceproject.yaml
  - ./storagebucket.yaml
configMapGenerator:
  - name: tranquil-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: tranquil
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: tranquil
      spec:
        dependsOn:
          - name: miroir-config
            namespace: miroir-system
