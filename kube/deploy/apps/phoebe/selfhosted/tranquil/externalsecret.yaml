---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tranquil
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: &app tranquil
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tranquil-secret
    template:
      data:
        JWT_SECRET: '{{ .jwtSecret }}'
        DPOP_SECRET: '{{ .dpopSecret }}'
        MASTER_KEY: '{{ .masterKey }}'
  dataFrom:
    - extract:
        key: app-tranquil
    - extract:
        key: strg-ucos-haydenmoe-tranquil-blobs
