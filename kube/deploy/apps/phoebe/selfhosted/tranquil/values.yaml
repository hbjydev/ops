---
route:
  app:
    hostnames:
      - at.hayden.moe
      - '*.at.hayden.moe'
    parentRefs:
      - name: external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: &port 3000

controllers:
  tandoor:
    containers:
      app:
        env:
          PDS_HOSTNAME: at.hayden.moe
          PDS_AGE_ASSURANCE_OVERRIDE: true
          INVITE_CODE_REQUIRED: true
          MAIL_FROM_ADDRESS: pds@hayden.moe
          MAIL_FROM_NAME: Hayden's PDS
          CRAWLERS: https://bsky.network,https://relay.upcloud.world
configMaps:
  msmtprc:
    enabled: true
    data:
      msmtprc: |
        defaults

        account relay
        host smtp-relay
        from pds@hayden.moe

        account default: relay

defaultPodOptions:
  imagePullSecrets:
    - name: imp-atcr
