---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tranquil
  namespace: selfhosted
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: tranquil
  components:
    - ../../../../../../components/postgres/cert
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/selfhosted/tranquil/app
  postBuild:
    substitute:
      APP: tranquil
      NAMESPACE: selfhosted
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              # Never auto-rollback a failed upgrade. A Helm rollback
              # restores the previous chart *and* its values, so for
              # rook-ceph-cluster it silently downgraded Ceph and left
              # the mon crashlooping against a newer on-disk layout.
              # A failed upgrade should stay failed and visible.
              #
              # This must be set explicitly: Flux defaults it to true
              # whenever retries > 0, so removing the line would not
              # change the behaviour.
              remediateLastFailure: false
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: tranquil
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: tranquil
        spec:
          values:
            route:
              app:
                hostnames:
                  - at.hayden.moe
                  - '*.at.hayden.moe'
                parentRefs:
                  - name: external
                    namespace: network
                    sectionName: https
                rules:
                  - backendRefs:
                      - identifier: app
                        port: &port 3000

            controllers:
              tandoor:
                containers:
                  app:
                    env:
                      PDS_HOSTNAME: at.hayden.moe
                      PDS_AGE_ASSURANCE_OVERRIDE: true
                      INVITE_CODE_REQUIRED: true
                      MAIL_FROM_ADDRESS: pds@hayden.moe
                      MAIL_FROM_NAME: Hayden's PDS
                      CRAWLERS: https://bsky.network,https://relay.upcloud.world
            configMaps:
              msmtprc:
                enabled: true
                data:
                  msmtprc: |
                    defaults

                    account relay
                    host smtp-relay
                    from pds@hayden.moe

                    account default: relay

            defaultPodOptions:
              imagePullSecrets:
                - name: imp-atcr
