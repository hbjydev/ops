---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
  namespace: selfhosted
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: miniflux
  components:
    - ../../../../../../components/postgres/cert
    - ../../../../../../components/kanidm/private
  dependsOn:
    - name: core-kyverno-config
      namespace: kyverno
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kube/deploy/apps/base/selfhosted/miniflux/app
  postBuild:
    substitute:
      APP: miniflux
      NAMESPACE: selfhosted
      OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
      OIDC_DISPLAY_NAME: Miniflux
      OIDC_GROUP_PREFIX: miniflux
      OIDC_ORIGIN: https://miniflux.hayden.moe/
      OIDC_REDIRECT_URLS: '["https://miniflux.hayden.moe/oauth2/oidc/callback"]'
      OIDC_USERS_GROUP_MEMBERS: '[hayden]'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            crds: CreateReplace
          rollback:
            cleanupOnFail: true
            recreate: true
          timeout: 15m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              remediateLastFailure: true
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: miniflux
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: miniflux
        spec:
          values:
            route:
              app:
                hostnames:
                  - "{{ .Release.Name }}.hayden.moe"
                parentRefs:
                  - name: external
                    namespace: network
                    sectionName: https
                rules:
                  - backendRefs:
                      - identifier: app
                        port: &port 8080
            controllers:
              miniflux:
                containers:
                  app:
                    env:
                      TRUSTED_REVERSE_PROXY_NETWORKS: '172.18.0.0/16'
                      METRICS_ALLOWED_NETWORKS: '172.18.0.0/16'
                      OAUTH2_OIDC_DISCOVERY_ENDPOINT: 'https://sso.hayden.moe/oauth2/openid/miniflux'
                      OAUTH2_OIDC_PROVIDER_NAME: 'Hayden.moe SSO'
                      OAUTH2_REDIRECT_URL: 'https://miniflux.hayden.moe/oauth2/oidc/callback'
