---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
resources:
  - ../../../base/selfhosted/miniflux/ks.yaml
configMapGenerator:
  - name: miniflux-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
  - target:
      kind: Kustomization
      name: miniflux
    patch: |
      ---
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: miniflux
      spec:
        postBuild:
          substitute:
            OIDC_DISPLAY_NAME: Miniflux
            OIDC_ORIGIN: https://miniflux.hayden.moe/
            OIDC_REDIRECT_URLS: '["https://miniflux.hayden.moe/oauth2/oidc/callback"]'
            OIDC_GROUP_PREFIX: miniflux
            OIDC_USERS_GROUP_MEMBERS: '[hayden]'
            OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
        dependsOn:
          - name: core-kyverno-config
            namespace: kyverno
          - name: miroir-config
            namespace: miroir-system
