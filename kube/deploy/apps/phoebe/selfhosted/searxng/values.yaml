---
route:
  app:
    hostnames:
      - "{{ .Release.Name }}.hayden.moe"
      - search.hayden.moe
    parentRefs:
      - name: external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: &port 8080
controllers:
  searxng:
    containers:
      app:
        env:
          SEARXNG_BASE_URL: https://search.hayden.moe
