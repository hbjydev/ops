---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smtp-relay
  namespace: selfhosted
  labels:
    kustomization.flux.home.arpa/helm-defaults: disabled
spec:
  interval: 1h
  path: ./kube/deploy/apps/base/selfhosted/smtp-relay/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          install:
            crds: CreateReplace
            strategy:
              name: RetryOnFailure
          rollback:
            cleanupOnFail: true
          timeout: 10m
          upgrade:
            cleanupOnFail: true
            crds: CreateReplace
            strategy:
              name: RemediateOnFailure
            remediation:
              # Never auto-rollback a failed upgrade. A Helm rollback
              # restores the previous chart *and* its values, so for
              # rook-ceph-cluster it silently downgraded Ceph and left
              # the mon crashlooping against a newer on-disk layout.
              # A failed upgrade should stay failed and visible.
              #
              # This must be set explicitly: Flux defaults it to true
              # whenever retries > 0, so removing the line would not
              # change the behaviour.
              remediateLastFailure: false
              retries: 2
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: smtp-relay
      patch: |
        ---
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: smtp-relay
        spec:
          values:
            service:
              app:
                annotations:
                  external-dns.kubernetes.io/hostname: smtp-relay.hayden.moe
                  lbipam.cilium.io/ips: 10.80.0.25
                type: LoadBalancer
                externalTrafficPolicy: Local
            configMaps:
              config:
                data:
                  maddy.conf: |-
                    state_dir /cache/state
                    runtime_dir /cache/run
                    tls off
                    hostname hayden.moe
                    smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
                        default_source {
                            deliver_to &remote_queue
                        }
                    }
                    target.queue remote_queue {
                        target &remote_smtp
                    }
                    target.smtp remote_smtp {
                        starttls yes
                        auth plain {env:SMTP_RELAY_USERNAME} {env:SMTP_RELAY_PASSWORD}
                        targets tcp://{env:SMTP_RELAY_SERVER}:587
                    }
