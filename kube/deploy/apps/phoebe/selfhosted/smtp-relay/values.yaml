---
service:
  app:
    annotations:
      external-dns.kubernetes.io/hostname: smtp-relay.hayden.moe
      lbipam.cilium.io/ips: 10.80.0.25
    type: LoadBalancer
    externalTrafficPolicy: Local
configMaps:
  config:
    data:
      maddy.conf: |-
        state_dir /cache/state
        runtime_dir /cache/run
        tls off
        hostname hayden.moe
        smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
            default_source {
                deliver_to &remote_queue
            }
        }
        target.queue remote_queue {
            target &remote_smtp
        }
        target.smtp remote_smtp {
            starttls yes
            auth plain {env:SMTP_RELAY_USERNAME} {env:SMTP_RELAY_PASSWORD}
            targets tcp://{env:SMTP_RELAY_SERVER}:587
        }
