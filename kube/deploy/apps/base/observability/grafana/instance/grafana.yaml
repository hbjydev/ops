---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth: ${GRAFANA_AUTH}
    auth.anonymous: ${GRAFANA_ANONYMOUS_AUTH}
    auth.generic_oauth:
      enabled: "true"
      name: ${GRAFANA_OIDC_NAME}
      allow_sign_up: "true"
      client_id: "grafana"
      client_secret: ""
      scopes: "openid email profile groups_name"
      email_attribute_path: "email"
      login_attribute_path: "preferred_username"
      name_attribute_path: "name"
      auth_url: "${GRAFANA_OIDC_AUTH_URL}"
      token_url: "${GRAFANA_OIDC_TOKEN_URL}"
      api_url: "${GRAFANA_OIDC_USERINFO_URL}"
      role_attribute_path: "${GRAFANA_OIDC_ROLE_ATTRIBUTE}"
      allow_assign_grafana_admin: "true"
      use_refresh_token: "true"
      use_pkce: "true"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
      allow_embedding: "true"
    server:
      enable_gzip: "true"
      root_url: "${GRAFANA_URL}"

  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_INSTALL_PLUGINS
                  value: "${GRAFANA_PLUGINS}"
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-kanidm-oauth2-credentials
                      key: CLIENT_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc

  httpRoute:
    spec:
      hostnames: ${GRAFANA_ROUTE_HOSTNAMES}
      parentRefs: ${GRAFANA_ROUTE_PARENT_REFS}
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: "${STORAGE_CAPACITY}"
      storageClassName: "${STORAGE_CLASS}"

  disableDefaultSecurityContext: All
