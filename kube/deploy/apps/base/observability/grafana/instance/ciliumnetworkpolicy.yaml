---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-x-a-grafana-peers
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana-operator
      toPorts:
        - ports:
            - port: '3000'
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: '8429'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vlsingle
      toPorts:
        - ports:
            - port: '9428'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vtsingle
      toPorts:
        - ports:
            - port: '10428'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports:
            - port: '9093'
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
          matchExpressions:
            - key: gateway.networking.k8s.io/gateway-name
              operator: In
              values:
                - internal
                - external
      toPorts:
        - ports:
            - port: '10443'
              protocol: TCP
