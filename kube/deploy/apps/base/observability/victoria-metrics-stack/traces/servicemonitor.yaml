---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: victoria-traces
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vtsingle
      app.kubernetes.io/instance: victoria-traces
    matchExpressions:
      - key: operator.victoriametrics.com/additional-service
        operator: DoesNotExist
  endpoints:
    - port: http
      relabelings:
        - targetLabel: victoriametrics_app
          replacement: "true"
