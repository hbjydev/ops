---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vtsingle_v1.json
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: victoria-traces
spec:
  image:
    repository: victoriametrics/victoria-traces
    tag: v0.13.0
    pullPolicy: Always

  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  retentionPeriod: "${RETENTION_PERIOD}"

  storage:
    storageClassName: "${STORAGE_CLASS}"
    resources:
      requests:
        storage: "${STORAGE_CAPACITY}"
