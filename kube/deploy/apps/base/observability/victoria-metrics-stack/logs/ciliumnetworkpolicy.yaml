---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-victoria-logs
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vlsingle
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
            app.kubernetes.io/managed-by: litellm-operator
            app.kubernetes.io/name: mcp-victorialogs
      toPorts:
        - ports:
            - port: '9428'
              protocol: TCP
