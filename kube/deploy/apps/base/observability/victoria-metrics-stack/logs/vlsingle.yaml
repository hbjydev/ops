---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/operator.victoriametrics.com/vlsingle_v1.json
apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: victoria-logs
spec:
  image:
    repository: victoriametrics/victoria-logs
    tag: v1.53.0
    pullPolicy: Always

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  retentionPeriod: "${RETENTION_PERIOD}"

  storage:
    storageClassName: "${STORAGE_CLASS}"
    resources:
      requests:
        storage: "${STORAGE_CAPACITY}"
