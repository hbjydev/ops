---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  install:
    crds: Skip
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: Skip
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      remediateLastFailure: false
  rollback:
    cleanupOnFail: true
  timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-defaults
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      optional: true
