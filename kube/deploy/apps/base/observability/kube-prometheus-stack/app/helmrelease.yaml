---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  install:
    crds: Skip
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: Skip
    cleanupOnFail: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 2
      remediateLastFailure: false
  rollback:
    cleanupOnFail: true
  timeout: 10m
  values:
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      enabled: false
    kubeProxy:
      enabled: false
    kubelet:
      serviceMonitor:
        enabled: false
    prometheus:
      enabled: false
    prometheus-node-exporter:
      enabled: false
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      podLabels:
        egress.netpol.home.arpa/apiserver: allow
        ingress.netpol.home.arpa/host: allow
        ingress.netpol.home.arpa/o11y: allow
    grafana:
      enabled: false
      forceDeployDashboards: true
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
    prometheusOperator:
      podLabels:
        egress.netpol.home.arpa/apiserver: allow
        ingress.netpol.home.arpa/apiserver: allow
        ingress.netpol.home.arpa/host: allow
        ingress.netpol.home.arpa/o11y: allow
  # Admission hook jobs have no chart-native podLabels setting.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Job
              labelSelector: app.kubernetes.io/component=prometheus-operator-webhook
            patch: |-
              - op: add
                path: /spec/template/metadata/labels/egress.netpol.home.arpa~1apiserver
                value: allow
