---
controllers:
  sabnzbd:
    pod:
      labels:
        egress.netpol.home.arpa/internet: allow
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/sabnzbd
          tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
        env:
          SABNZBD__PORT: &port 80
          TZ: Europe/London
        envFrom:
          - secretRef:
              name: sabnzbd-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api?mode=version
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    controller: sabnzbd
    ports:
      http:
        port: *port
persistence:
  config:
    existingClaim: sabnzbd
  tmp:
    type: emptyDir
