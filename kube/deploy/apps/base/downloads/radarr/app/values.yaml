---
controllers:
  radarr:
    annotations:
      reloader.stakater.com/auto: "true"
      configmap.reloader.stakater.com/reload: trusted-roots
    pod:
      labels:
            # Linux .NET uses OpenSSL roots, including SSL_CERT_FILE.
        trust.home.arpa/inject: "true"
        ingress.netpol.home.arpa/internal: allow
        egress.netpol.home.arpa/internet: allow
        egress.netpol.home.arpa/sabnzbd: allow
        egress.netpol.home.arpa/qbittorrent: allow
        egress.netpol.home.arpa/slskd: allow
        egress.netpol.home.arpa/prowlarr: allow
        egress.netpol.home.arpa/postgres: allow
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/radarr
          tag: 7.0.2.10888@sha256:69ea515df6e2a3ea1490cfa127ffaaf9597a9db84fffa2fa150a6fae98fe04cb
        env:
          RADARR__APP__INSTANCENAME: Radarr
          RADARR__APP__THEME: dark
          RADARR__AUTH__METHOD: External
          RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
          RADARR__LOG__DBENABLED: "False"
          RADARR__LOG__LEVEL: info
          RADARR__SERVER__PORT: &port 80
          RADARR__UPDATE__BRANCH: develop

              # Verify the pooler using the injected SSL_CERT_FILE trust bundle.
          TZ: Europe/London
        envFrom:
          - secretRef:
              name: radarr-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ping
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
defaultPodOptions:
  annotations: {}
  labels: {}
  schedulingGates: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    controller: radarr
    ports:
      http:
        port: *port
persistence:
  postgres-certs:
    type: custom
    globalMounts:
      - path: /var/run/secrets/postgresql
        readOnly: true
    volumeSpec:
      csi:
        driver: csi.cert-manager.io
        readOnly: true
        volumeAttributes:
          csi.cert-manager.io/issuer-name: postgres-client-ca-v2
          csi.cert-manager.io/issuer-kind: ClusterIssuer
          csi.cert-manager.io/key-algorithm: ECDSA
          csi.cert-manager.io/key-size: "384"
          csi.cert-manager.io/key-encoding: PKCS8
          csi.cert-manager.io/key-usages: client auth
          csi.cert-manager.io/common-name: radarr
          csi.cert-manager.io/fs-group: "1000"
  config:
    existingClaim: radarr
  config-cache:
    existingClaim: radarr-cache
    globalMounts:
      - path: /config/MediaCover
  tmp:
    type: emptyDir
