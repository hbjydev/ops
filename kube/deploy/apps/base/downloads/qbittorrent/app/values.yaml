---
controllers:
  qbittorrent:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      labels:
        egress.netpol.home.arpa/internet: allow
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
        env:
          TZ: Europe/London
          QBT_WEBUI_PORT: &port 80
          QBT_TORRENTING_PORT: 50469
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v2/app/version
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
service:
  app:
    ports:
      http:
        port: *port
configMaps:
  config:
    data:
      .qbt.toml: |-
        [qbittorrent]
        addr = "http://localhost:80"
persistence:
  config:
    existingClaim: "{{ .Release.Name }}"
  config-file:
    type: configMap
    identifier: config
    globalMounts:
      - path: /config/.qbt.toml
        subPath: .qbt.toml
  tmp:
    type: emptyDir
