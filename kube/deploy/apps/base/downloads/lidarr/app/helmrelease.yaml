---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      lidarr:
        annotations:
          reloader.stakater.com/auto: "true"
          configmap.reloader.stakater.com/reload: trusted-roots
        pod:
          labels:
            # Linux .NET uses OpenSSL roots, including SSL_CERT_FILE.
            trust.home.arpa/inject: "true"
            ingress.netpol.home.arpa/internal: allow
            egress.netpol.home.arpa/internet: allow
            egress.netpol.home.arpa/sabnzbd: allow
            egress.netpol.home.arpa/qbittorrent: allow
            egress.netpol.home.arpa/slskd: allow
            egress.netpol.home.arpa/prowlarr: allow
            egress.netpol.home.arpa/postgres: allow
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.2.1.5196
            env:
              LIDARR__APP__INSTANCENAME: Lidarr
              LIDARR__APP__THEME: dark
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
              LIDARR__LOG__DBENABLED: "False"
              LIDARR__LOG__LEVEL: info
              LIDARR__SERVER__PORT: &port 80
              LIDARR__UPDATE__BRANCH: develop

              # Verify the pooler using the injected SSL_CERT_FILE trust bundle.
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: lidarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      annotations: {}
      labels: {}
      schedulingGates: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: lidarr
        ports:
          http:
            port: *port
    persistence:
      postgres-certs:
        type: custom
        globalMounts:
          - path: /var/run/secrets/postgresql
            readOnly: true
        volumeSpec:
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: postgres-client-ca-v2
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/key-algorithm: ECDSA
              csi.cert-manager.io/key-size: "384"
              csi.cert-manager.io/key-encoding: PKCS8
              csi.cert-manager.io/key-usages: client auth
              csi.cert-manager.io/common-name: lidarr
              csi.cert-manager.io/fs-group: "1000"
      config:
        existingClaim: '{{ .Release.Name }}'
      tmp:
        type: emptyDir
