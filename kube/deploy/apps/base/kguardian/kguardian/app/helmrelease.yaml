---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 30m
  # Chart 1.29.2 hardcodes password auth and has no extra volume/mount values.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: kguardian-broker
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kguardian-broker
                annotations:
                  configmap.reloader.stakater.com/reload: trusted-roots
              spec:
                template:
                  metadata:
                    labels:
                      trust.home.arpa/inject: "true"
                  spec:
                    containers:
                      - name: broker
                        env:
                          - name: DB_PASSWORD
                            $patch: delete
                          - name: DATABASE_URL
                            value: "${KGUARDIAN_DATABASE_URL}"
                        volumeMounts:
                          - name: postgres-certs
                            mountPath: /var/run/secrets/postgresql
                            readOnly: true
                    volumes:
                      - name: postgres-certs
                        csi:
                          driver: csi.cert-manager.io
                          readOnly: true
                          volumeAttributes:
                            csi.cert-manager.io/issuer-name: postgres-client-ca-v2
                            csi.cert-manager.io/issuer-kind: ClusterIssuer
                            csi.cert-manager.io/key-algorithm: ECDSA
                            csi.cert-manager.io/key-size: "384"
                            csi.cert-manager.io/key-encoding: PKCS8
                            csi.cert-manager.io/key-usages: client auth
                            csi.cert-manager.io/common-name: kguardian
                            csi.cert-manager.io/fs-group: "1000"
  values:
    defaultPodOptions:
      annotations: {}
      labels: {}
      schedulingGates: []
  valuesFrom:
    - kind: ConfigMap
      name: kguardian-defaults
    - kind: ConfigMap
      name: kguardian-values
      optional: true
