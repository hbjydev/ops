---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-kguardian-broker
  namespace: kguardian
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kguardian-broker
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kguardian-frontend
            k8s:io.kubernetes.pod.namespace: kguardian
        - matchLabels:
            app.kubernetes.io/name: kguardian-llm-bridge
            k8s:io.kubernetes.pod.namespace: kguardian
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
    # The controller is hostNetwork, so its connections have node identities.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: '9090'
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-kguardian-evaluator
  namespace: kguardian
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kguardian-evaluator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kguardian-broker
            k8s:io.kubernetes.pod.namespace: kguardian
      toPorts:
        - ports:
            - port: '8082'
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-kguardian-llm-bridge
  namespace: kguardian
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kguardian-llm-bridge
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kguardian-frontend
            k8s:io.kubernetes.pod.namespace: kguardian
        - matchLabels:
            app.kubernetes.io/name: litellm
            app.kubernetes.io/managed-by: litellm-operator
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
