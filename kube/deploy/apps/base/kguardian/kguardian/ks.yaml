---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kguardian
  namespace: kguardian
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kguardian
  interval: 1h
  components:
    - ../../../../../../components/postgres/base
  path: "./kube/deploy/apps/base/kguardian/kguardian/app"
  prune: true
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: &namespace kguardian
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
