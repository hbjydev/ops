---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: continuwuity
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      continuwuity:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          unbound:
            restartPolicy: Always
            image:
              repository: docker.io/madnuttah/unbound
              tag: 1.25.1-3@sha256:1184c6210e56348ffdc446f31eb3108d6d0844ecfd18cf7081ca4ebe87ae8de8
            env:
              DISABLE_SET_PERMS: "true"
              HEALTHCHECK_PORT: "53"
              TZ: Europe/London
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: &probeDnsExec
                    command:
                      - /usr/local/unbound/sbin/healthcheck.sh
                  initialDelaySeconds: 15
                  periodSeconds: 60
                  timeoutSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *probeDnsExec
                  initialDelaySeconds: 2
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL

        containers:
          app:
            image:
              repository: forgejo.ellis.link/continuwuation/continuwuity
              tag: v26.9.3-maxperf
            env:
              CONTINUWUITY_LOG: info
              CONTINUWUITY_ADDRESS: 0.0.0.0
              CONTINUWUITY_PORT: &port 8008

              CONTINUWUITY_DATABASE_PATH: /data
              CONTINUWUITY_DATABASE_BACKUP_PATH: /backups
              CONTINUWUITY_DATABASE_BACKUPS_TO_KEEP: "3"

              CONTINUWUITY_ROCKSDB_COMPRESSION_ALGO: zstd
              CONTINUWUITY_ROCKSDB_COMPRESSION_LEVEL: "32767"
              CONTINUWUITY_ROCKSDB_BOTTOMMOST_COMPRESSION_LEVEL: "32767"
              CONTINUWUITY_ROCKSDB_BOTTOMMOST_COMPRESSION: "true"

              # Security
              CONTINUWUITY_ALLOW_FEDERATION: true
              CONTINUWUITY_ALLOW_ENCRYPTION: true
              CONTINUWUITY_FORGET_FORCED_UPON_LEAVE: true
              CONTINUWUITY_REQUIRE_AUTH_FOR_PROFILE_REQUESTS: true
              CONTINUWUITY_ALLOW_PUBLIC_ROOM_DIRECTORY_WITHOUT_AUTH: false
              CONTINUWUITY_ALLOW_PUBLIC_ROOM_DIRECTORY_OVER_FEDERATION: false
              CONTINUWUITY_LOCKDOWN_PUBLIC_ROOM_DIRECTORY: "true"
              CONTINUWUITY_ALLOW_LEGACY_MEDIA: "false"
              CONTINUWUITY_MAX_REQUEST_SIZE: "20971520"

              # DNS
              CONTINUWUITY_QUERY_OVER_TCP_ONLY: false
              CONTINUWUITY_IP_LOOKUP_STRATEGY: "1"
              CONTINUWUITY_DNS_TIMEOUT: 60
              CONTINUWUITY_DNS_CACHE_ENTRIES: 0

              CONTINUWUITY_ADMIN_EXECUTE: '["media delete-past-remote-media -b 30d"]'
              CONTINUWUITY_ADMIN_EXECUTE_ERRORS_IGNORE: true

              CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""

              # OIDC
              CONTINUWUITY_OAUTH__OIDC__CLIENT_ID:
                secretKeyRef:
                  name: continuwuity-kanidm-oauth2-credentials
                  key: CLIENT_ID
              CONTINUWUITY_OAUTH__OIDC__CLIENT_SECRET:
                secretKeyRef:
                  name: continuwuity-kanidm-oauth2-credentials
                  key: CLIENT_SECRET

              # LiveKit Matrix RTC
              CONTINUWUITY_MATRIX_RTC__LIVEKIT__KEY:
                secretKeyRef:
                  name: livekit-keys
                  key: LIVEKIT_KEY
              CONTINUWUITY_MATRIX_RTC__LIVEKIT__SECRET:
                secretKeyRef:
                  name: livekit-keys
                  key: LIVEKIT_SECRET
              CONTINUWUITY_MATRIX_RTC__LIVEKIT__AUTO_CREATE: true

              TOKIO_WORKER_THREADS: "4"
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: continuwuity-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      annotations: {}
      schedulingGates: []
      dnsConfig:
        nameservers:
          - "127.0.0.1"
        options:
          - name: ndots
            value: "1"
        searches:
          - cluster.local
      dnsPolicy: None
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: continuwuity
        ports:
          http:
            port: *port

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          continuwuity:
            app:
              - path: /data
              - path: /backups
                subPath: backups

      tmp:
        type: emptyDir

      unbound:
        type: configMap
        name: unbound-configmap
        advancedMounts:
          continuwuity:
            unbound:
              - path: /usr/local/unbound/unbound.conf
                subPath: unbound.conf

      unbound-iana:
        type: emptyDir
        advancedMounts:
          continuwuity:
            unbound:
              - path: /usr/local/unbound/iana.d
