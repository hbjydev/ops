---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-miniflux
  namespace: selfhosted
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mcp-miniflux
            app.kubernetes.io/managed-by: litellm-operator
            io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
