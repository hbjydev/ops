---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miniflux
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      miniflux:
        annotations:
          reloader.stakater.com/auto: "true"
          configmap.reloader.stakater.com/reload: trusted-roots
        pod:
          labels:
            trust.home.arpa/inject: "true"
            ingress.netpol.home.arpa/external: allow
            egress.netpol.home.arpa/internet: allow
            egress.netpol.home.arpa/postgres: allow
            ingress.netpol.home.arpa/o11y: allow
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: miniflux/miniflux
              tag: 2.3.5-distroless@sha256:c826edc9c2284a8181e297d22a5ade1482bd9a8a4beabb2b6356bd22ce731310
            env:
              TZ: Europe/London
              DATABASE_URL:
                secretKeyRef:
                  name: miniflux-postgres
                  key: url
              RUN_MIGRATIONS: '1'
              METRICS_COLLECTOR: '1'
              DISABLE_LOCAL_AUTH: '1'
              OAUTH2_PROVIDER: oidc
              OAUTH2_CLIENT_ID:
                secretKeyRef:
                  name: miniflux-kanidm-oauth2-credentials
                  key: CLIENT_ID
              OAUTH2_CLIENT_SECRET:
                secretKeyRef:
                  name: miniflux-kanidm-oauth2-credentials
                  key: CLIENT_SECRET
              OAUTH2_USER_CREATION: '1'
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1024Mi
    defaultPodOptions:
      annotations: {}
      labels: {}
      schedulingGates: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        enabled: true
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
