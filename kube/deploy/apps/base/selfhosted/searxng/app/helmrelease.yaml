---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      annotations: {}
      labels: {}
      schedulingGates: []
  valuesFrom:
    - kind: ConfigMap
      name: searxng-defaults
    - kind: ConfigMap
      name: searxng-values
      optional: true
