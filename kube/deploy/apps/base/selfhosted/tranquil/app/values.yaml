---
controllers:
  tandoor:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      labels:
        ingress.netpol.home.arpa/external: allow
        egress.netpol.home.arpa/internet: allow
        egress.netpol.home.arpa/smtp-relay: allow
        egress.netpol.home.arpa/postgres: allow
        trust.home.arpa/inject: "true"
        ingress.netpol.home.arpa/o11y: allow
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: atcr.io/tranquil.farm/tranquil-pds
          digest: sha256:b106af21c9847814b6cff30d2ede2ca3a3649deb78f47bb1288b88a6eed7d276
        env:
          TZ: Europe/London
          SERVER_HOST: 0.0.0.0
          SERVER_PORT: &port 3000
          DATABASE_URL:
            secretKeyRef:
              name: tranquil-postgres
              key: url
          BLOB_STORAGE_BACKEND: s3
          S3_BUCKET:
            secretKeyRef:
              name: tranquil-media-s3
              key: S3_BUCKET
          S3_ENDPOINT:
            secretKeyRef:
              name: tranquil-media-s3
              key: AWS_ENDPOINT_URL
          AWS_ACCESS_KEY_ID:
            secretKeyRef:
              name: tranquil-media-s3
              key: AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY:
            secretKeyRef:
              name: tranquil-media-s3
              key: AWS_SECRET_ACCESS_KEY
        envFrom:
          - secretRef:
              name: tranquil-secret
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /xrpc/_health
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 1024Mi
defaultPodOptions:
  annotations: {}
  labels: {}
  schedulingGates: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  automountServiceAccountToken: true

serviceMonitor:
  app:
    enabled: true
    endpoints:
      - port: http
        scheme: http
        path: /metrics
        interval: 1m

service:
  app:
    ports:
      http:
        port: *port
persistence:
  msmtprc:
    type: configMap
    name: '{{ .Release.Name }}'
    globalMounts:
      - path: /etc/msmtprc
        subPath: msmtprc

  tmpfs:
    type: emptyDir
    globalMounts:
      - path: /tmp
