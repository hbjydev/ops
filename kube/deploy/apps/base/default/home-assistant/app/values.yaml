---
controllers:
  home-assistant:
    annotations:
      reloader.stakater.com/auto: "true"

    pod:
      labels:
        egress.netpol.home.arpa/internet: allow
        egress.netpol.home.arpa/lan: allow
        egress.netpol.home.arpa/iot: allow

    initContainers:
      init-config:
        image: &img
          repository: ghcr.io/home-operations/home-assistant
          tag: 2026.11.1@sha256:c129b1e4190273254d93d413fe2a083233c9202d84cb08f84dddb01861df432e
        command:
          - /bin/bash
          - -c
          - |
            rm /config/configuration.yaml
            cp /run/config/configuration.yaml /config/configuration.yaml

    containers:
      app:
        image: *img
        env:
          TZ: Europe/London
          HASS_HTTP_USE_X_FORWARDED_FOR: true
        securityContext:
          readOnlyRootFilesystem: true
          privileged: true
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 2Gi

defaultPodOptions:
  annotations: {}
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    ports:
      http:
        appProtocol: kubernetes.io/ws
        port: 8123

persistence:
  config:
    existingClaim: "{{ .Release.Name }}"
    globalMounts:
      - path: /config
  configmap:
    type: configMap
    name: home-assistant-configmap
    advancedMounts:
      home-assistant:
        init-config:
          - path: /run/config/configuration.yaml
            subPath: configuration.yaml
  config-cache:
    existingClaim: "{{ .Release.Name }}-cache"
    globalMounts:
      - path: /config/.venv
  tmp:
    type: emptyDir
