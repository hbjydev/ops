---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          labels:
            egress.netpol.home.arpa/internet: allow
            egress.netpol.home.arpa/lan: allow
            egress.netpol.home.arpa/iot: allow

        initContainers:
          init-config:
            image: &img
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
            command:
              - /bin/bash
              - -c
              - |
                rm /config/configuration.yaml
                cp /run/config/configuration.yaml /config/configuration.yaml

        containers:
          app:
            image: *img
            env:
              TZ: Europe/London
              HASS_HTTP_USE_X_FORWARDED_FOR: true
            securityContext:
              readOnlyRootFilesystem: true
              privileged: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi

    defaultPodOptions:
      annotations: {}
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 8123

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      configmap:
        type: configMap
        name: home-assistant-configmap
        advancedMounts:
          home-assistant:
            init-config:
              - path: /run/config/configuration.yaml
                subPath: configuration.yaml
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      tmp:
        type: emptyDir
