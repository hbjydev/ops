---
controllers:
  matter-server:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        sysctls:
          - name: net.ipv6.conf.all.forwarding
            value: "0"
          - name: net.ipv6.conf.net1.accept_ra
            value: "2"
          - name: net.ipv6.conf.net1.accept_ra_rt_info_max_plen
            value: "64"
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
        # matter.js otherwise joins IPv4 mDNS on the default Cilium interface
        # instead of net1, so OTBR's SRP-proxied operational records are missed.
    initContainers:
      mdns-route:
        image:
          repository: nicolaka/netshoot
          tag: latest
        command:
          - ip
        args:
          - route
          - add
          - 224.0.0.0/4
          - dev
          - net1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          capabilities:
            drop: [ALL]
            add: [NET_ADMIN]
    containers:
      app:
        image:
          repository: ghcr.io/matter-js/matterjs-server
          tag: 1.5.5@sha256:ee149c7c67eff0e90f131e8f0d628f7b099591ec58473c8cda1209e8ae4df66e
        args:
          - --storage-path=/data
          - --primary-interface=net1
          - --ota-provider-dir=/data/ota
          - --production-mode
        env:
          TZ: Europe/London
          LOG_LEVEL: info
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 5580
          readiness: *probe
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}

service:
  matter-server:
    ports:
      http:
        port: 5580

persistence:
  data:
    existingClaim: "{{ .Release.Name }}"
    globalMounts:
      - path: /data
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
