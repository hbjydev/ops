---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matter-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled
  values:
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            sysctls:
              - name: net.ipv6.conf.all.forwarding
                value: "0"
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          labels:
            ingress.netpol.home.arpa/host: allow
            egress.netpol.home.arpa/iot: allow
            egress.netpol.home.arpa/lan: allow
            ingress.netpol.home.arpa/internal: allow
            egress.netpol.home.arpa/internet: allow
        # matter.js otherwise joins IPv4 mDNS on the default Cilium interface
        # instead of net1, so OTBR's SRP-proxied operational records are missed.
        initContainers:
          mdns-route:
            image:
              repository: nicolaka/netshoot
              tag: latest
            command:
              - ip
            args:
              - route
              - add
              - 224.0.0.0/4
              - dev
              - net1
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              capabilities:
                drop: [ALL]
                add: [NET_ADMIN]
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.6.0@sha256:9eb98c839d0b4b07f9230b96ad52de570f7f2a7c286c5992b4c04b6b26c08a3f
            args:
              - --storage-path=/data
              - --primary-interface=net1
              - --ota-provider-dir=/data/ota
              - --production-mode
            env:
              TZ: Europe/London
              LOG_LEVEL: info
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 5580
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}

    service:
      matter-server:
        ports:
          http:
            port: 5580

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
