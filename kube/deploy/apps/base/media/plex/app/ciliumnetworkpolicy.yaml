---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-plex-from-seerr
  namespace: media
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plex
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seerr
            k8s:io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: '32400'
              protocol: TCP
