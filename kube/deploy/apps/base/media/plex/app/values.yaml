---
controllers:
  plex:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      labels:
        egress.netpol.home.arpa/internet: allow
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/plex
          tag: 1.43.5.11079@sha256:06ef0fc23e9af9bbaf284c3f27972f94e703d13d6f745edeb6818fcbebf6c673
        env:
          TZ: Europe/London
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /identity
                port: &port 32400
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 6Gi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    type: ClusterIP
    ports:
      http:
        port: *port
persistence:
  config:
    existingClaim: "{{ .Release.Name }}"
  tmp:
    type: emptyDir
