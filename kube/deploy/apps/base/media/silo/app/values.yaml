---
controllers:
  silo:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      labels:
        egress.netpol.home.arpa/sonarr: allow
        egress.netpol.home.arpa/radarr: allow
        egress.netpol.home.arpa/seerr: allow
        ingress.netpol.home.arpa/external: allow
        ingress.netpol.home.arpa/o11y: allow
        egress.netpol.home.arpa/internet: allow
        egress.netpol.home.arpa/smtp-relay: allow
        egress.netpol.home.arpa/litellm: allow
        egress.netpol.home.arpa/postgres: allow
        egress.netpol.home.arpa/dragonfly: allow
    containers:
      app:
        image:
          repository: ghcr.io/silo-server/silo-server
          tag: build-1770@sha256:b989857a785638ad78daf5e90d8c54e11541b7fd6633b56f712524e7659f943d
        env:
          TZ: Europe/London
          PORT: &port 8080
          JF_PORT: &jfPort 8096
          DATABASE_URL:
            secretKeyRef:
              name: ${APP}-postgres
              key: url
          REDIS_URL: redis://localhost:6379
          SILO_PLUGIN_CACHE_DIR: /var/lib/silo/plugins
          POSTGRES_TUNE: auto
          MEDIA_CONTAINER_ROOT: /mnt/media
          SILO_METRICS_LISTEN: 0.0.0.0:9091
        envFrom:
          - secretRef:
              name: ${APP}
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
          privileged: true
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 6Gi

defaultPodOptions:
  labels: {}
  schedulingGates: []
  annotations: {}
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    type: ClusterIP
    ports:
      http:
        port: *port
      jellyfin-http:
        port: *jfPort
      metrics:
        port: 9091

serviceMonitor:
  main:
    enabled: true
    jobLabel: silo
    endpoints:
      - port: metrics
        interval: 30s
        scrapeTimeout: 10s
        path: /metrics

persistence:
  data:
    existingClaim: "{{ .Release.Name }}"
    globalMounts:
      - subPath: plugins
        path: /var/lib/silo/plugins
      - subPath: artwork
        path: /var/lib/silo/artwork
      - subPath: compat
        path: /var/lib/silo/compat

  cache:
    existingClaim: "{{ .Release.Name }}-cache"
    globalMounts:
      - subPath: npm
        path: /root/.npm
      - subPath: transcode
        path: /tmp/silo-transcode
      - subPath: download-artifacts
        path: /tmp/silo-download-artifacts
      - subPath: catalog-seeds
        path: /catalog-seeds

  tmp:
    type: emptyDir
