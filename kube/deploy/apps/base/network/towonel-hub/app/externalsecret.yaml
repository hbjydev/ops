---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: towonel-hub
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: towonel-hub-secret
    template:
      data:
        TOWONEL_HUB_OPERATOR_API_KEY: '{{ .hubOperatorApiKey }}'
        TOWONEL_HUB_KEK: '{{ .hubKek }}'
        TOWONEL_HUB_HASH_KEY: '{{ .inviteHashKey }}'
  dataFrom:
    - extract:
        key: app-towonel-hub
