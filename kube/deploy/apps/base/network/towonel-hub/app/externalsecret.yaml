---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: towonel-hub
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: towonel-hub-secret
  data:
    - secretKey: TOWONEL_HUB_OPERATOR_API_KEY
      remoteRef: { key: app-towonel-hub, property: hubOperatorApiKey }
    - secretKey: TOWONEL_HUB_KEK
      remoteRef: { key: app-towonel-hub, property: hubKek }
    - secretKey: TOWONEL_INVITE_HASH_KEY
      remoteRef: { key: app-towonel-hub, property: inviteHashKey }
