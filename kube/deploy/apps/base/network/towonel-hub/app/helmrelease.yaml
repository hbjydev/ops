---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-hub
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-node
  interval: 30m
  values:
    global:
      fullnameOverride: towonel-hub

    hub:
      enabled: true
      bindAddress: 0.0.0.0
      healthBindAddress: 0.0.0.0
      apiPort: 8443
      linkPort: 51444
      metricsPort: 9091
      rateLimitPerSecond: 5
      rateLimitBurst: 30

    edge:
      enabled: true
      bindAddress: 0.0.0.0
      httpsPort: 443
      httpPort: 80
      metricsPort: 9090
      tlsPort: 0
      dataDir: /data

    controllers:
      main:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              TOWONEL_DATA_DIR: /data

              TOWONEL_HUB_ALLOW_PRIVILEGED_PORTS: "true"
              TOWONEL_HUB_RELAY_URL: https://relay.towonel.${DOMAIN}
              TOWONEL_HUB_PUBLIC_URL: https://towonel.${DOMAIN}

              # Edge DNS differs from hub DNS, so override the derived default:
              TOWONEL_EDGE_IROH_PORT: "51820"
              TOWONEL_EDGE_PROXY_PROTOCOL: "true"
              TOWONEL_EDGE_RELAY_URL: https://relay.towonel.${DOMAIN}
            envFrom:
              - secretRef:
                  name: towonel-hub-secret

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
