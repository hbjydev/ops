---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: towonel-hub
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: towonel-hub
      app.kubernetes.io/controller: main
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            gateway.networking.k8s.io/gateway-name: external
      toPorts:
        - ports:
            - port: "4443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "51820"
              protocol: UDP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            netpol.home.arpa/o11y: "true"
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9091"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: iroh-relay
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "7842"
              protocol: UDP
    # Peers behind NAT can advertise any UDP port.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "0"
              protocol: UDP
            - port: "443"
              protocol: TCP
