---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: towonel-node
  namespace: towonel
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.13.4
  url: oci://git.ow-ops.eu/towonel/charts/towonel-node
  verify:
    provider: cosign
    secretRef:
      name: towonel-hub-cosign-pub
