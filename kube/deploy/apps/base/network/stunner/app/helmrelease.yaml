---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stunner
spec:
  chartRef:
    kind: OCIRepository
    name: stunner
  interval: 1h
  values:
    standardCrds:
      enabled: false
    stunnerGatewayOperator:
      dataplane:
        spec:
          enableMetricsEndpoint: true
          labels:
            ingress.netpol.home.arpa/host: allow
            ingress.netpol.home.arpa/o11y: allow
      deployment:
        podLabels:
          egress.netpol.home.arpa/apiserver: allow
          ingress.netpol.home.arpa/host: allow
          ingress.netpol.home.arpa/o11y: allow
    stunnerAuthService:
      deployment:
        podLabels:
          egress.netpol.home.arpa/apiserver: allow
          ingress.netpol.home.arpa/host: allow
          ingress.netpol.home.arpa/o11y: allow
