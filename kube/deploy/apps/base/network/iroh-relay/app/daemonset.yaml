---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/daemonset_v1.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iroh-relay
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: iroh-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iroh-relay
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      nodeSelector:
        kubernetes.io/hostname: ${RELAY_NODE}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: docker.io/n0computer/iroh-relay:1.0.0-rc.0
          args:
            - --config-path
            - /etc/iroh-relay/relay.toml
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: quic
              containerPort: 7842
              protocol: UDP
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/iroh-relay
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: iroh-relay-config
        - name: tls
          secret:
            secretName: iroh-relay-tls
