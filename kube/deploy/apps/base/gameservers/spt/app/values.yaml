---
controllers:
  spt:
    annotations:
      reloader.stakater.com/auto: "true"
    replicas: 1
    strategy: Recreate
    type: deployment

    serviceAccount:
      identifier: spt

    initContainers:
      install-mods:
        image: &image
          repository: ghcr.io/sp-tushonka/server-csharp
          tag: 4.1.6@sha256:ac23ccb3d77d828690823a269adbb14817cea18dc4f9529a4d87b3def4fa2f4a
        command:
          - /bin/bash
          - /install-mods.sh
        env: &baseEnv
          TZ: Europe/London
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - FSETID
              - SETGID
              - SETUID
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0

    containers:
      app:
        image: *image
        env:
          <<: *baseEnv
          SPT_IP: 0.0.0.0
          SPT_PORT: &port 6969
          SPT_BACKEND_PORT: *port
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        ports:
          - containerPort: *port
            protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true

defaultPodOptions:
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

service:
  app:
    controller: spt
    ipFamilies:
      - IPv4
    ports:
      spt:
        port: *port

persistence:
  data:
    existingClaim: '{{ .Release.Name }}'
    globalMounts:
      - path: /opt/spt/user

  scripts:
    type: configMap
    name: 'spt-scripts'
    defaultMode: 0o755
    globalMounts:
      - path: /install-mods.sh
        subPath: install-mods.sh

  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
