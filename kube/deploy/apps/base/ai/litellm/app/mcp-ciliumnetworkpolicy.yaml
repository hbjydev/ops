---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-mcp-from-litellm
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/managed-by: litellm-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
            app.kubernetes.io/managed-by: litellm-operator
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
            - port: '8086'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-mcp-miniflux
  namespace: ai
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/managed-by: litellm-operator
      app.kubernetes.io/name: mcp-miniflux
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: miniflux
            app.kubernetes.io/instance: miniflux
            io.kubernetes.pod.namespace: selfhosted
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
