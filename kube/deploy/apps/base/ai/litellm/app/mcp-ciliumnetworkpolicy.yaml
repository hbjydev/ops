---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-mcp-hass
  namespace: ai
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/managed-by: litellm-operator
      app.kubernetes.io/name: mcp-hass
  egress:
    - toEndpoints:
        - matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: external
            gateway.envoyproxy.io/owning-gateway-namespace: network
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: '10443'
              protocol: TCP
