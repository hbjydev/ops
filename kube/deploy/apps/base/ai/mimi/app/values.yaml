---
controllers:
  mimi:
    annotations:
      reloader.stakater.com/auto: "true"

    strategy: Recreate
    type: deployment

    pod:
      labels:
        egress.netpol.home.arpa/litellm: allow
        egress.netpol.home.arpa/memini: allow
        egress.netpol.home.arpa/searxng: allow
    containers:
      mimi:
        image:
          repository: ghcr.io/hbjydev/livvi
          tag: 7ecf8f9@sha256:45686eb31369583ce436849db314808a38d1eadad6c372e9561a47e82427e29e
        env:
              # Memories
          LIVVI_DATABASE_URL: sqlite:/data/livvi.db?mode=rwc

              # Lossless Context
          LIVVI_LCM_ENABLE: '1'
          LIVVI_LCM_DATABASE_URL: sqlite:/data/lcm.db?mode=rwc

              # Web Tools
          RUST_LOG: info
          LIVVI_LOG_FORMAT: json
          OTEL_TRACES_SAMPLER: traceidratio
          OTEL_TRACES_SAMPLER_ARG: '0.5'
        envFrom:
          - secretRef:
              name: mimi-secret
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: Always

persistence:
  data:
    existingClaim: '{{ .Release.Name }}'

  tmpfs:
    type: emptyDir
    globalMounts:
      - path: /tmp
