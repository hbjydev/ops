---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimi
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: mimi-defaults
    - kind: ConfigMap
      name: mimi-values
      optional: true
