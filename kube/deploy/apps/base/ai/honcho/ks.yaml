---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app honcho
  namespace: ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../../components/postgres/base
    - ../../../../../../components/dragonfly
  interval: 1h
  path: ./kube/deploy/apps/base/ai/honcho/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: &namespace ai
      DATABASE_EXTENSIONS: |
        [
          { name: vector }
        ]
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false
