---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: honcho
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      annotations: {}
      labels: {}
      schedulingGates: []
  valuesFrom:
    - kind: ConfigMap
      name: honcho-defaults
    - kind: ConfigMap
      name: honcho-values
      optional: true
