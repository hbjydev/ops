---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  chartRef:
    kind: OCIRepository
    name: llmkube
  interval: 1h
  values:
    fullnameOverride: llmkube
    namespace: ai
    podLabels:
      egress.netpol.home.arpa/apiserver: allow
      ingress.netpol.home.arpa/apiserver: allow
      ingress.netpol.home.arpa/host: allow
      ingress.netpol.home.arpa/o11y: allow
      egress.netpol.home.arpa/internet-https: allow
