---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name forgejo
  namespace: dev
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
  components:
    - ../../../../../../components/postgres/cert
    - ../../../../../../components/kanidm/private
    - ../../../../../../components/anubis
    - ../../../../../../components/dragonfly
    - ../../../../../../components/kopiur
  interval: 1h
  path: "./kube/deploy/apps/base/dev/forgejo/app"
  postBuild:
    substitute:
      APP: *name
      NAMESPACE: &namespace dev

      APP_UID: "1000"
      APP_GID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
