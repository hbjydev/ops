---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-e-a-forgejo-anubis
  namespace: dev
spec:
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: forgejo-anubis
      app.kubernetes.io/controller: anubis
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: forgejo
            app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-forgejo-from-anubis
  namespace: dev
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: forgejo
      app.kubernetes.io/name: forgejo
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: forgejo-anubis
            app.kubernetes.io/controller: anubis
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: np-i-a-forgejo-from-towonel
  namespace: dev
spec:
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: forgejo
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: towonel-agent
            app.kubernetes.io/instance: towonel-agent
            k8s:io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: '2222'
              protocol: TCP
