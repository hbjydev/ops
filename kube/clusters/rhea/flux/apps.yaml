---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kube/deploy/apps/rhea
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-info
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  patches:
    - # Add Kustomization defaults for all child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          deletionPolicy: WaitForTermination
          postBuild:
            substitute:
              CLUSTER: ${CLUSTER}
              CLUSTER_DNS_IP: ${CLUSTER_DNS_IP}
              CLUSTER_DNS_COREDNS_RESOLVERS: ${CLUSTER_DNS_COREDNS_RESOLVERS}
              CLUSTER_POD_CIDR: ${CLUSTER_POD_CIDR}
              CLUSTER_SVC_CIDR: ${CLUSTER_SVC_CIDR}
          interval: 5m
          prune: true
          sourceRef:
            kind: GitRepository
            name: flux-system
            namespace: flux-system
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: kustomization.flux.home.arpa/defaults notin (disabled)
    - # Allow child Kustomizations to manage their own HelmRelease patches
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  install:
                    crds: CreateReplace
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  timeout: 15m
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: kustomization.flux.home.arpa/defaults notin (disabled), kustomization.flux.home.arpa/helm-defaults notin (disabled)
